<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŠkoPilot Family — Arcade</title>
<style>
  @font-face{ font-family:'PixelArcade'; src:url('assets/fonts/PressStart2P.ttf') format('truetype'); font-display:swap; }
  :root{
    --bg:#092725; --line:#1d4a44;
    --sage:#7e9a90; --sage2:#a9c4ba; --teal:#34625b;
    --white:#ffffff; --gold:#f5c518;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--white);
    font-family:'PixelArcade','Courier New',monospace;
    overflow:hidden;height:100vh;user-select:none;cursor:default;}
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px,rgba(0,0,0,0) 4px);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    background:radial-gradient(ellipse at 50% 42%, transparent 56%, rgba(0,0,0,.45) 100%);}

  #screen{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;}
  .topbar{padding:clamp(14px,3vh,34px) clamp(24px,4vw,64px) 0;}
  .logo{height:clamp(58px,12vh,128px);width:auto;display:block;}

  .main{flex:1;display:flex;align-items:center;gap:clamp(18px,3vw,56px);
        padding:clamp(6px,1.6vh,20px) clamp(24px,4vw,64px);min-height:0;}

  /* HRY (vlevo) */
  #games{flex:1.5;min-width:0;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(12px,2.6vh,30px);}
  .cat-head{display:flex;align-items:center;gap:10px;
    font-size:clamp(9px,1.4vw,15px);color:var(--sage2);letter-spacing:3px;
    margin-bottom:clamp(8px,1.3vh,13px);}
  .cat-head::before{content:"";width:13px;height:13px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--sage2),var(--teal));clip-path:polygon(0 0,100% 0,70% 100%,0 100%);}
  .cat-head::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent);}
  .row{display:flex;flex-wrap:wrap;gap:clamp(12px,1.6vw,26px);}

  .card{width:clamp(140px,17vw,224px);display:flex;flex-direction:column;
    cursor:pointer;transition:transform .14s;}
  .frame{width:100%;aspect-ratio:4/3;position:relative;border-radius:11px;overflow:hidden;
    border:3px solid var(--line);
    background:radial-gradient(125% 100% at 50% 0%, #103a33 0%, #0a2824 48%, #051b18 100%);
    box-shadow:inset 0 0 0 2px var(--bg), 0 8px 18px rgba(0,0,0,.5);}
  .frame svg{display:block;width:100%;height:100%;}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(130% 70% at 50% -12%, rgba(255,255,255,.10), transparent 58%),
      repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 3px,rgba(0,0,0,0) 4px);}
  .cap{margin-top:10px;font-size:clamp(8px,1vw,12px);color:var(--sage);letter-spacing:1px;line-height:1.5;}
  .genre{margin-top:5px;font-size:clamp(6px,.82vw,9px);color:var(--teal);letter-spacing:1px;}
  .hi{margin-top:4px;font-size:clamp(6px,.82vw,9px);color:#3c5a52;letter-spacing:1px;}

  .card.sel{transform:translateY(-7px) scale(1.05);}
  .card.sel .frame{border-color:var(--sage2);
    box-shadow:inset 0 0 0 2px var(--bg),0 0 26px rgba(169,196,186,.55),0 8px 18px rgba(0,0,0,.5);}
  .card.sel .cap{color:var(--sage2);}
  .card.sel .hi{color:var(--gold);}
  .card.sel .frame::before{content:"\25B6 PLAY";position:absolute;z-index:3;left:50%;bottom:8px;
    transform:translateX(-50%);background:var(--sage2);color:var(--bg);
    font-size:clamp(7px,.95vw,11px);padding:4px 10px;border-radius:4px;letter-spacing:1px;
    animation:blink .5s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .card.soon{cursor:not-allowed;}
  .card.soon .frame{filter:saturate(.5) brightness(.78);}
  .card.soon .frame::before{content:"SOON";position:absolute;z-index:3;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,2.4vw,30px);color:var(--white);letter-spacing:4px;
    text-shadow:0 0 12px rgba(0,0,0,.9),2px 2px 0 var(--teal);background:rgba(6,32,29,.32);}
  .ribbon{position:absolute;z-index:4;top:10px;right:-30px;transform:rotate(45deg);
    background:var(--gold);color:var(--bg);font-size:clamp(6px,.82vw,9px);
    letter-spacing:2px;padding:3px 34px;box-shadow:0 2px 6px rgba(0,0,0,.4);}

  /* MASKOT (vpravo) */
  #hero{flex:1;min-width:0;align-self:stretch;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:clamp(6px,2vh,22px);}
  .spot{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
    width:96%;height:88%;
    background:radial-gradient(ellipse at center, rgba(169,196,186,.20), rgba(126,154,144,.05) 46%, transparent 70%);
    filter:blur(3px);pointer-events:none;}
  .mascot{position:relative;z-index:2;width:auto;
    max-height:clamp(220px,56vh,560px);max-width:96%;
    filter:drop-shadow(0 20px 16px rgba(0,0,0,.5));animation:bob 3.4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-12px);}}
  .start{position:relative;z-index:2;margin-top:clamp(8px,1.6vh,16px);
    font-size:clamp(12px,1.8vw,20px);color:var(--white);letter-spacing:3px;animation:blink 1.05s steps(1) infinite;}

  .foot{z-index:3;display:flex;flex-direction:column;gap:6px;align-items:center;
    padding:0 12px clamp(10px,2.2vh,22px);}
  .hint{font-size:clamp(6px,1vw,10px);color:var(--teal);letter-spacing:1px;}
  .credit{font-size:clamp(6px,1vw,9px);color:#24514a;letter-spacing:1px;}

  /* 4:3 automat */
  @media (min-aspect-ratio:1/1) and (max-aspect-ratio:3/2){
    .main{gap:clamp(14px,2.2vw,34px);}
    #games{flex:1.4;gap:clamp(10px,1.8vh,22px);}
    #hero{flex:.95;}
    .mascot{max-height:clamp(190px,42vh,400px);}
    .logo{height:clamp(50px,9vh,104px);}
  }
  /* portrait monitor (na výšku) — maskot VEDLE her, vše seskupené víc na střed */
  @media (max-aspect-ratio:1/1){
    .main{justify-content:center; align-items:center;
          gap:clamp(16px,4vw,46px);
          padding:clamp(8px,2vh,24px) clamp(14px,3.5vw,44px);}
    #games{flex:0 1 auto;}
    #hero{flex:0 1 auto; align-self:center; justify-content:center; padding-bottom:0;}
    .card{width:clamp(150px,26vw,264px);}
    .cat-head{font-size:clamp(11px,2.2vw,18px);}
    .cap{font-size:clamp(10px,1.7vw,14px);}
    .mascot{max-height:clamp(300px,46vh,660px); max-width:46vw;}
    .logo{height:clamp(76px,12vh,176px);}
    .topbar{display:flex; justify-content:center; padding-bottom:clamp(6px,1.5vh,16px);}
  }
  /* velmi úzké displeje (telefon) — teprve tady skládej pod sebe */
  @media (max-width:600px){
    .main{flex-direction:column-reverse;gap:clamp(8px,2vh,18px);overflow-y:auto;}
    #hero{flex:0 0 auto;align-self:center;}
    .mascot{max-height:clamp(120px,22vh,210px);}
    .start{display:none;}
    .row{justify-content:center;}
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="screen">
    <div class="topbar">
      <img class="logo" src="assets/logo_t.png"
           onerror="this.onerror=null;this.src='assets/logo.png'" alt="ŠkoPilot Family">
    </div>
    <div class="main">
      <div id="games"></div>
      <div id="hero">
        <div class="spot"></div>
        <img class="mascot" src="assets/skopilot.png"
             onerror="this.onerror=null;this.src='assets/skopilotHead.png'" alt="ŠkoPilot">
        <div class="start">PUSH START</div>
      </div>
    </div>
    <div class="foot">
      <div class="hint">JOYSTICK / &larr;&rarr; SELECT &nbsp;&middot;&nbsp; START / ENTER PLAY &nbsp;&middot;&nbsp; ESC = MENU</div>
      <div class="credit">&copy; 2026 ŠKODA &middot; ŠKOPILOT FAMILY</div>
    </div>
  </div>

<script>
  const HEAD='assets/skopilotHead.png';

  const ART = {
    flappy:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect y="108" width="160" height="12" fill="#0d2c1d"/>
      <g fill="#2fc56f"><rect x="98" y="0" width="28" height="40"/><rect x="98" y="80" width="28" height="28"/></g>
      <g fill="#0d4631"><rect x="94" y="36" width="36" height="9"/><rect x="94" y="80" width="36" height="9"/></g>
      <circle cx="140" cy="62" r="9" fill="#f5c518"/>
      <text x="140" y="66" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8960a" text-anchor="middle">$</text>
      <image href="${HEAD}" x="38" y="42" width="42" height="42"/></svg>`,

    cliptris:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect x="52" y="6" width="56" height="108" fill="#08231f" stroke="#1d4a44" stroke-width="2"/>
      <g><rect x="54" y="92" width="18" height="18" fill="#7e9a90"/><rect x="72" y="92" width="18" height="18" fill="#34625b"/>
        <rect x="90" y="92" width="18" height="18" fill="#a9c4ba"/><rect x="54" y="74" width="18" height="18" fill="#34625b"/>
        <rect x="90" y="74" width="18" height="18" fill="#f5c518"/><rect x="72" y="56" width="18" height="18" fill="#7e9a90"/>
        <rect x="90" y="56" width="18" height="18" fill="#34625b"/></g>
      <g fill="#a9c4ba"><rect x="72" y="14" width="18" height="18"/><rect x="72" y="32" width="18" height="18"/>
        <rect x="90" y="32" width="18" height="18"/></g></svg>`,

    pro:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <g fill="#0d4631"><rect x="6" y="104" width="148" height="10" rx="3"/><rect x="14" y="74" width="46" height="8" rx="3"/><rect x="104" y="62" width="50" height="8" rx="3"/></g>
      <g fill="#2fc56f"><rect x="6" y="104" width="148" height="2"/><rect x="14" y="74" width="46" height="2"/><rect x="104" y="62" width="50" height="2"/></g>
      <!-- tool -->
      <g transform="translate(34,52)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#f5c518"/>
        <text x="0" y="2" font-family="sans-serif" font-size="8" font-weight="bold" fill="#5a4a00" text-anchor="middle">.py</text></g>
      <!-- bug -->
      <g transform="translate(78,92)"><rect x="-11" y="-9" width="22" height="18" rx="7" fill="#ff5d5d"/>
        <circle cx="-4" cy="-2" r="2.4" fill="#fff"/><circle cx="4" cy="-2" r="2.4" fill="#fff"/></g>
      <!-- chassis -->
      <g transform="translate(118,40)" fill="none" stroke="#a9c4ba" stroke-width="2" stroke-dasharray="4 3">
        <rect x="-13" y="2" width="26" height="20" rx="4"/><circle cx="0" cy="-3" r="7"/></g>
      <!-- skopilot -->
      <image href="${HEAD}" x="16" y="82" width="22" height="22"/></svg>`,
  };

  const CATS = [
    { head:'ŠKOPILOT', items:[
      { playable:true, title:'FLAPPY ŠKOPILOT', genre:'FLY &amp; DODGE', url:'flappy/index.html', hi:'sko_flappy_best', art:ART.flappy } ] },
    { head:'ŠKOPILOT CLIP', items:[
      { playable:true, title:'ŠKOPILOT CLIP', genre:'CLEAR CLIP &middot; TIME ATTACK', url:'clip/index.html', hi:'sko_clip_best', time:true, art:ART.cliptris } ] },
    { head:'ŠKOPILOT PRO', items:[
      { playable:true, title:'ŠKOPILOT PRO', genre:'AGENT BUILDER', url:'pro/index.html', hi:'sko_pro_best', art:ART.pro } ] },
  ];

  function fmtTime(cs){
    const m=Math.floor(cs/6000), s=Math.floor((cs%6000)/100), c=cs%100;
    const base=(m>0? m+':'+String(s).padStart(2,'0') : String(s));
    return base+'.'+String(c).padStart(2,'0');
  }

  const gamesEl=document.getElementById('games');
  const playables=[];
  CATS.forEach(cat=>{
    const block=document.createElement('div');
    block.innerHTML='<div class="cat-head">'+cat.head+'</div>';
    const row=document.createElement('div'); row.className='row';
    cat.items.forEach(it=>{
      const card=document.createElement('div');
      if(it.playable){
        const hi=localStorage.getItem(it.hi)||0;
        let hiTxt;
        if(it.time){ hiTxt = hi ? ('BEST '+fmtTime(+hi)) : 'BEST --'; }
        else { hiTxt = 'HI '+String(hi).padStart(5,'0'); }
        card.className='card';
        card.innerHTML='<div class="frame">'+it.art+'</div><div class="cap">'+it.title+'</div>'+
          '<div class="genre">'+it.genre+'</div><div class="hi">'+hiTxt+'</div>';
        const idx=playables.length;
        playables.push({url:it.url,card});
        card.addEventListener('click',()=>{ sel=idx; render(); launch(); });
        card.addEventListener('mouseenter',()=>{ sel=idx; render(); });
      } else {
        card.className='card soon'; card.title='Coming soon';
        card.innerHTML='<div class="frame"><div class="ribbon">SOON</div>'+it.art+'</div>'+
          '<div class="cap">'+it.title+'</div><div class="genre">'+it.genre+'</div><div class="hi">COMING SOON</div>';
      }
      row.appendChild(card);
    });
    block.appendChild(row); gamesEl.appendChild(block);
  });

  let sel=0;
  function render(){ playables.forEach((p,i)=>p.card.classList.toggle('sel', i===sel)); }
  function launch(){ window.location.href=playables[sel].url; }
  render();

  addEventListener('keydown',e=>{
    switch(e.key){
      case 'ArrowRight': case 'd': case 'ArrowDown': case 's': sel=(sel+1)%playables.length; render(); break;
      case 'ArrowLeft': case 'a': case 'ArrowUp': case 'w': sel=(sel-1+playables.length)%playables.length; render(); break;
      case 'Enter': case ' ': e.preventDefault(); launch(); break;
    }
  });

  // jemné stoupající jiskřičky
  const fx=document.getElementById('fx'), fc=fx.getContext('2d');
  let parts=[];
  function resizeFx(){ fx.width=innerWidth; fx.height=innerHeight; parts=[];
    const n=Math.round(fx.width/30);
    for(let i=0;i<n;i++) parts.push({x:Math.random()*fx.width,y:Math.random()*fx.height,
      s:Math.random()<.2?2:1, v:0.12+Math.random()*0.45, a:0.15+Math.random()*0.4}); }
  addEventListener('resize', resizeFx); resizeFx();
  (function fxLoop(){ requestAnimationFrame(fxLoop);
    fc.clearRect(0,0,fx.width,fx.height);
    for(const p of parts){ p.y-=p.v; if(p.y<-4){p.y=fx.height+4;p.x=Math.random()*fx.width;}
      fc.globalAlpha=p.a; fc.fillStyle=p.s===2?'#a9c4ba':'#356057'; fc.fillRect(p.x|0,p.y|0,p.s,p.s); }
    fc.globalAlpha=1; })();

  addEventListener('gamepadconnected', ()=>{ let prev=0;
    (function poll(){ const gp=navigator.getGamepads()[0];
      if(gp){ const x=gp.axes[0]||0, now=Date.now();
        if(now-prev>220){ if(x>0.5){sel=(sel+1)%playables.length;render();prev=now;}
          else if(x<-0.5){sel=(sel-1+playables.length)%playables.length;render();prev=now;} }
        if(gp.buttons.some(b=>b.pressed)) launch(); }
      requestAnimationFrame(poll); })();
  });
</script>
</body>
</html>
