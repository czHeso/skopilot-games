<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ŠkoBreakout</title>
  <style>
    @font-face{ font-family:'PixelArcade'; src:url('../assets/fonts/PressStart2P.ttf') format('truetype'); font-display:swap; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body{height:100%;}
    body { background:#03100a; display:flex; align-items:center; justify-content:center;
           height:100vh; overflow:hidden; font-family:'Trebuchet MS', system-ui, sans-serif;
           color:#eef6f4; user-select:none; }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);
    }
    #stage{ transform-origin:center center; position:relative; }
    #hud { display:flex; gap:1.8rem; margin-bottom:.7rem; font-size:18px; color:#5a8a72; letter-spacing:1px; }
    #hud span { font-weight:700; color:#eef6f4; }
    canvas { border-radius:8px; border:2px solid #1c4a35; display:block; background:#07140d;
             box-shadow:0 0 30px rgba(47,197,111,.25); }
    #hint { margin-top:.6rem; font-size:14px; color:#3f6b55; text-align:center; }
    #menuBtn{
      position:fixed; top:14px; left:14px; z-index:60;
      background:#0c2418; color:#b8f5da; border:1px solid #235c41;
      border-radius:8px; padding:8px 14px; font-size:15px; letter-spacing:1px;
      cursor:pointer; font-family:inherit;
    }
    #menuBtn:hover{ background:#11331f; }
  </style>
</head>
<body>
  <button id="menuBtn" onclick="location.href='../index.html'">◀ MENU</button>
  <div id="stage">
    <div id="hud">SKÓRE: <span id="score">0</span>&nbsp; NEJL.: <span id="best">0</span>&nbsp; 🪙 <span id="coins">0</span>&nbsp; LVL: <span id="level">1</span>&nbsp; ❤ <span id="lives">3</span></div>
    <canvas id="c" width="620" height="680"></canvas>
    <div id="hint">← → nebo A D = pádlo &nbsp;|&nbsp; Mezerník = vypustit míček &nbsp;|&nbsp; ESC = menu</div>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl =document.getElementById('best');
const coinsEl=document.getElementById('coins');
const levelEl=document.getElementById('level');
const livesEl=document.getElementById('lives');
const stage  =document.getElementById('stage');

function fitStage(){
  const s = Math.min(window.innerWidth/stage.offsetWidth, window.innerHeight/stage.offsetHeight);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
fitStage();

const headImg=new Image();
headImg.src='../invaders/skopilotHead.png';

const W=canvas.width, H=canvas.height;

// rozložení cihel
const COLS=10, ROWS=6, BPAD=8, BTOP=70, BSIDE=24;
const BW=(W-BSIDE*2-BPAD*(COLS-1))/COLS, BH=24;
const ROW_COLORS=['#0d4631','#1c7a4a','#27b063','#2fc56f','#62e29a','#b8f5da'];

let paddle, ball, bricks, score, coins, best, lives, level, state, particles;

best=+localStorage.getItem('sko_breakout_best')||0;
bestEl.textContent=best;

function buildBricks(){
  bricks=[];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const isCoin = ((r*COLS+c) % 7 === 3); // některé cihly jsou mince
      bricks.push({
        x: BSIDE + c*(BW+BPAD),
        y: BTOP  + r*(BH+BPAD),
        w: BW, h: BH, alive:true,
        coin:isCoin, color:isCoin ? '#f5c518' : ROW_COLORS[r],
        pts: (ROWS-r)*10
      });
    }
  }
}

function resetBall(){
  ball={ x:paddle.x, y:paddle.y-16, r:8, vx:0, vy:0, stuck:true, speed:5 };
}

function init(){
  score=0; coins=0; lives=3; level=1;
  particles=[];
  paddle={ x:W/2, y:H-50, w:110, h:16, speed:8 };
  scoreEl.textContent=0; coinsEl.textContent=0; levelEl.textContent=1; livesEl.textContent=3;
  buildBricks();
  resetBall();
  state='idle';
}

function launchBall(){
  if(ball.stuck){
    ball.stuck=false;
    const ang=-Math.PI/2 + (Math.random()*0.6-0.3);
    ball.vx=Math.cos(ang)*ball.speed;
    ball.vy=Math.sin(ang)*ball.speed;
  }
}

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if(e.key==='Escape'){ location.href='../index.html'; return; }
  if(e.key===' '){
    if(state==='idle'){ state='playing'; launchBall(); }
    else if(state==='gameover'||state==='win'){ init(); state='playing'; }
    else if(state==='playing'){ launchBall(); }
  }
});
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

function spawnParticles(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3;
    particles.push({x,y,dx:Math.cos(a)*s,dy:Math.sin(a)*s,life:1,color});
  }
}

function nextLevel(){
  level++; levelEl.textContent=level;
  ball.speed += 0.6;
  buildBricks();
  resetBall();
  state='idle';
}

function update(){
  // pádlo
  if(keys['ArrowLeft']||keys['a']) paddle.x=Math.max(paddle.w/2, paddle.x-paddle.speed);
  if(keys['ArrowRight']||keys['d']) paddle.x=Math.min(W-paddle.w/2, paddle.x+paddle.speed);

  if(ball.stuck){ ball.x=paddle.x; ball.y=paddle.y-16; return; }

  ball.x+=ball.vx; ball.y+=ball.vy;

  // stěny
  if(ball.x-ball.r<0){ ball.x=ball.r; ball.vx*=-1; }
  if(ball.x+ball.r>W){ ball.x=W-ball.r; ball.vx*=-1; }
  if(ball.y-ball.r<0){ ball.y=ball.r; ball.vy*=-1; }

  // spadl dolů
  if(ball.y-ball.r>H){
    lives--; livesEl.textContent=lives;
    spawnParticles(ball.x,H-10,'#ff6a6a',14);
    if(lives<=0){ saveBest(); state='gameover'; }
    else resetBall();
    return;
  }

  // pádlo
  if(ball.vy>0 && ball.y+ball.r>=paddle.y-paddle.h/2 &&
     ball.y-ball.r<=paddle.y+paddle.h/2 &&
     Math.abs(ball.x-paddle.x)<=paddle.w/2+ball.r){
    const hit=(ball.x-paddle.x)/(paddle.w/2); // -1..1
    const ang=-Math.PI/2 + hit*(Math.PI/3); // ±60°
    ball.vx=Math.cos(ang)*ball.speed;
    ball.vy=Math.sin(ang)*ball.speed;
    ball.y=paddle.y-paddle.h/2-ball.r;
  }

  // cihly
  for(const b of bricks){
    if(!b.alive) continue;
    if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w &&
       ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
      b.alive=false;
      score+=b.pts; scoreEl.textContent=score; saveBest();
      if(b.coin){ coins++; coinsEl.textContent=coins; score+=20; scoreEl.textContent=score; }
      spawnParticles(ball.x,ball.y,b.color,10);
      // odraz podle menšího průniku
      const overlapX=Math.min(ball.x+ball.r-b.x, b.x+b.w-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y, b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY) ball.vx*=-1; else ball.vy*=-1;
      break;
    }
  }

  if(!bricks.some(b=>b.alive)){ saveBest(); nextLevel(); }

  for(const p of particles){ p.x+=p.dx; p.y+=p.dy; p.dy+=0.08; p.life-=0.035; }
  particles=particles.filter(p=>p.life>0);
}

function saveBest(){
  if(score>best){ best=score; bestEl.textContent=best; localStorage.setItem('sko_breakout_best',best); }
}

// === VYKRESLENÍ ===
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawBricks(){
  for(const b of bricks){
    if(!b.alive) continue;
    ctx.fillStyle=b.color;
    if(b.coin){ ctx.save(); ctx.shadowColor='#ffe066'; ctx.shadowBlur=10; }
    roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
    if(b.coin){ ctx.restore();
      ctx.fillStyle='#c8960a'; ctx.font='bold 13px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('$', b.x+b.w/2, b.y+b.h/2);
    } else {
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.fillRect(b.x+2,b.y+2,b.w-4,3);
    }
  }
}

function drawPaddle(){
  const p=paddle;
  ctx.fillStyle='#2fc56f';
  roundRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h,8); ctx.fill();
  ctx.fillStyle='#0d4631';
  roundRect(p.x-p.w/2,p.y-p.h/2,p.w,4,4); ctx.fill();
  if(headImg.complete && headImg.naturalWidth!==0){
    const s=p.h+10;
    ctx.drawImage(headImg, p.x-s/2, p.y-s/2, s, s);
  }
}

function drawBall(){
  ctx.save();
  ctx.shadowColor='#b8f5da'; ctx.shadowBlur=10;
  ctx.fillStyle='#eef6f4';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOverlay(){
  ctx.fillStyle='rgba(3,16,10,0.82)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const cx=W/2, cy=H/2;
  if(state==='idle'){
    ctx.fillStyle='#2fc56f'; ctx.font='900 40px Trebuchet MS, sans-serif';
    ctx.fillText('ŠkoBreakout',cx,cy-50);
    ctx.fillStyle='#cdeede'; ctx.font='17px sans-serif';
    ctx.fillText('Rozbij všechny cihly a sbírej mince!',cx,cy-14);
    ctx.fillText('Pádlem odrážej míček.',cx,cy+12);
    ctx.fillStyle='#ffff44'; ctx.font='bold 16px sans-serif';
    ctx.fillText('Mezerník = vypustit míček',cx,cy+48);
  } else if(state==='gameover'){
    ctx.fillStyle='#ff6a6a'; ctx.font='900 42px Trebuchet MS, sans-serif';
    ctx.fillText('KONEC HRY',cx,cy-30);
    ctx.fillStyle='#cdeede'; ctx.font='18px sans-serif';
    ctx.fillText('Skóre: '+score+'   Nejlepší: '+best,cx,cy+8);
    ctx.fillStyle='#ffff44'; ctx.font='bold 16px sans-serif';
    ctx.fillText('Mezerník pro restart',cx,cy+44);
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(state==='playing') update();
  ctx.fillStyle='#07140d'; ctx.fillRect(0,0,W,H);
  drawBricks();
  drawParticles();
  drawPaddle();
  drawBall();
  if(state!=='playing') drawOverlay();
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
