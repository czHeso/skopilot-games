<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŠkoPilot Games — Arcade</title>
<style>
  :root{
    --g1:#2fc56f;        /* ŠkoPilot smaragdová */
    --g2:#62e29a;        /* světlá zelená */
    --g3:#0d4631;        /* tmavě zelené tělo */
    --mint:#b8f5da;      /* mátový highlight */
    --white:#eef6f4;
    --gold:#f5c518;      /* mince */
    --bg:#04110b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 18%, #0c2a1d 0%, #04110b 70%);
    color:var(--white);
    font-family:'Trebuchet MS', system-ui, sans-serif;
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    user-select:none;
    cursor:default;
  }
  /* CRT scanlines + vinětace */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
    box-shadow:inset 0 0 180px 40px rgba(0,0,0,0.9);
  }

  /* MARQUEE */
  header{
    text-align:center;
    margin-top:clamp(10px,3vh,40px);
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .avatar{
    height:clamp(70px,13vh,150px);
    width:auto;
    margin-bottom:clamp(2px,1vh,10px);
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(47,197,111,.5));
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{50%{transform:translateY(-8px);}}
  .title{
    font-size:clamp(32px,7.5vw,82px);
    font-weight:900;
    letter-spacing:clamp(2px,1vw,10px);
    line-height:1;
    color:#fff;
    text-shadow:
      0 0 6px var(--g1),
      0 0 16px var(--g1),
      0 0 34px var(--g1),
      0 0 60px rgba(47,197,111,.6);
    animation:flicker 5s infinite;
  }
  .title .pilot{color:var(--g2);
    text-shadow:0 0 6px var(--g2),0 0 16px var(--g2),0 0 34px var(--g2);}
  .subtitle{
    margin-top:clamp(6px,1.4vh,14px);
    font-size:clamp(12px,2.2vw,22px);
    letter-spacing:clamp(2px,1vw,8px);
    color:var(--gold);
    text-shadow:0 0 10px rgba(245,197,24,.7);
  }
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{opacity:1;}
    20%,24%,55%{opacity:.72;}
  }

  .coin{
    margin-top:clamp(6px,1.2vh,12px);
    font-size:clamp(11px,2vw,18px);
    letter-spacing:4px;
    color:#fff;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* GAME GRID */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    z-index:1;
  }
  .grid{
    display:flex;
    gap:clamp(14px,3vw,40px);
    flex-wrap:wrap;
    justify-content:center;
    padding:0 16px;
  }
  .card{
    width:clamp(180px,22vw,300px);
    aspect-ratio:3/4;
    background:linear-gradient(160deg,#0e2c1f,#08180f);
    border:2px solid #1c4a35;
    border-radius:16px;
    padding:clamp(12px,1.6vw,22px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s;
    cursor:pointer;
  }
  .card .art{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(46px,9vw,96px);
    filter:drop-shadow(0 0 12px rgba(47,197,111,.45));
  }
  .card h2{
    font-size:clamp(15px,1.9vw,26px);
    margin-top:6px;
    color:#fff;
    letter-spacing:1px;
  }
  .card .genre{
    font-size:clamp(10px,1.2vw,14px);
    color:var(--g2);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
  }
  .card .hi{
    font-size:clamp(10px,1.2vw,14px);
    color:var(--gold);
    margin-top:8px;
    letter-spacing:1px;
  }
  .card .ctrl{
    font-size:clamp(9px,1.1vw,12px);
    color:#5a8a72;
    margin-top:6px;
  }
  .card.sel{
    border-color:var(--g1);
    box-shadow:0 0 0 2px var(--g1),0 0 26px rgba(47,197,111,.6),inset 0 0 30px rgba(47,197,111,.12);
    transform:translateY(-8px) scale(1.04);
  }
  .card.sel::after{
    content:"▶ HRÁT";
    position:absolute;
    bottom:-14px;left:50%;transform:translateX(-50%);
    background:var(--g1);color:#04110b;
    font-weight:900;font-size:clamp(10px,1.3vw,15px);
    padding:4px 14px;border-radius:20px;letter-spacing:2px;
    box-shadow:0 0 16px rgba(47,197,111,.8);
    animation:blink 1s steps(1) infinite;
  }

  footer{
    z-index:1;
    margin-bottom:clamp(10px,3vh,30px);
    font-size:clamp(10px,1.5vw,15px);
    letter-spacing:2px;
    color:#5a8a72;
    text-align:center;
    padding:0 12px;
  }
  .kbd{
    display:inline-block;border:1px solid #235c41;border-radius:5px;
    padding:1px 7px;margin:0 2px;
    color:#cdeede;background:#0c2418;font-size:.9em;
  }
</style>
</head>
<body>
  <header>
    <img class="avatar" src="assets/skopilot.png"
         onerror="this.onerror=null;this.src='invaders/skopilotHead.png'" alt="ŠkoPilot">
    <div class="title">ŠKO<span class="pilot">PILOT</span> GAMES</div>
    <div class="subtitle">★ ARCADE · ŠKOPILOT EDITION ★</div>
    <div class="coin">— VHOĎ MINCI · INSERT COIN —</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span class="kbd">◀</span><span class="kbd">▶</span> vybrat hru &nbsp;·&nbsp;
    <span class="kbd">ENTER</span> / <span class="kbd">MEZERNÍK</span> spustit &nbsp;·&nbsp;
    v hře <span class="kbd">ESC</span> = zpět do menu
  </footer>

<script>
  const GAMES = [
    { title:'Flappy ŠkoPilot', genre:'Letová obratnost', art:'🚀',
      url:'flappy/index.html', hi:'sko_flappy_best',  ctrl:'Mezerník / tlačítko = skok' },
    { title:'ŠkoInvaders',     genre:'Vesmírná střílečka', art:'👾',
      url:'invaders/index.html', hi:'sko_invaders_best', ctrl:'Joystick + tlačítko = palba' },
    { title:'ŠkoSnake',        genre:'Sbírej mince', art:'🐍',
      url:'snake/index.html', hi:'sko_snake_best', ctrl:'Joystick = směr' },
  ];

  const grid = document.getElementById('grid');
  let sel = 0;

  GAMES.forEach((g,i)=>{
    const hi = localStorage.getItem(g.hi) || 0;
    const card = document.createElement('div');
    card.className = 'card' + (i===0?' sel':'');
    card.innerHTML = `
      <div class="art">${g.art}</div>
      <h2>${g.title}</h2>
      <div class="genre">${g.genre}</div>
      <div class="hi">HI-SCORE&nbsp; ${String(hi).padStart(5,'0')}</div>
      <div class="ctrl">${g.ctrl}</div>`;
    card.addEventListener('click', ()=>{ sel=i; render(); launch(); });
    card.addEventListener('mouseenter', ()=>{ sel=i; render(); });
    grid.appendChild(card);
  });

  const cards = [...document.querySelectorAll('.card')];
  function render(){ cards.forEach((c,i)=>c.classList.toggle('sel', i===sel)); }
  function launch(){ window.location.href = GAMES[sel].url; }

  document.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowRight': case 'ArrowDown': case 'd': case 's':
        sel = (sel+1)%GAMES.length; render(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'a': case 'w':
        sel = (sel-1+GAMES.length)%GAMES.length; render(); break;
      case 'Enter': case ' ':
        e.preventDefault(); launch(); break;
    }
  });

  // Volitelná podpora herního ovladače (joystick bývá HID klávesnice = už řešeno výše)
  window.addEventListener('gamepadconnected', ()=>{
    let prev = 0;
    (function poll(){
      const gp = navigator.getGamepads()[0];
      if(gp){
        const x = gp.axes[0]||0;
        const now = Date.now();
        if(now-prev>220){
          if(x>0.5){ sel=(sel+1)%GAMES.length; render(); prev=now; }
          else if(x<-0.5){ sel=(sel-1+GAMES.length)%GAMES.length; render(); prev=now; }
        }
        if(gp.buttons.some(b=>b.pressed)) launch();
      }
      requestAnimationFrame(poll);
    })();
  });
</script>
</body>
</html>
