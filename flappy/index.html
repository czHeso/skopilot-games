<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy ŠkoPilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1f2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    #hud { display: flex; gap: 2rem; margin-bottom: 0.75rem; font-size: 14px; color: #888; }
    #hud span { font-weight: 500; color: #eee; }
    #canvas { border-radius: 12px; border: 1px solid #333; display: block; cursor: pointer; }
    #hint { margin-top: 0.5rem; font-size: 13px; color: #555; }
  </style>
</head>

  <canvas id="canvas" width="580" height="380"></canvas>
  <div id="hint">Mezerník nebo klik = skok</div>

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const coinsEl = document.getElementById('coins');

    const W = canvas.width, H = canvas.height;
    const GRAVITY = 0.45;
    const JUMP = -6;
    const PIPE_W = 52;
    const PIPE_SPEED = 2.6;
    const PIPE_INTERVAL = 1600;
    const BALL_X = 110;

    const HIT_RX = 22;
    const HIT_RY = 19;
    const HIT_OY = 0;
    const AV_W = HIT_RX * 2 + 2;
    const AV_H = HIT_RY * 2 + 2;

    // Generuje zamíchanou sadu podle aktuálního skóre
    let gapQueue = [];
    function buildGapQueue() {
      const big   = () => Math.floor(Math.random() * 20) + 180;  // 180-200
      const mid   = () => Math.floor(Math.random() * 20) + 125;  // 125-145
      const small = () => Math.floor(Math.random() * 15) + 90;   // 90-105

      let arr;
      if (score >= 20) {
        // Od 20: 0 velká, 1 střední, 4 malé
        arr = [mid(), small(), small(), small(), small()];
      } else if (score >= 10) {
        // Od 10: 0 velká, 3 střední, 2 malé
        arr = [mid(), mid(), mid(), small(), small()];
      } else {
        // Začátek: 1 velká, 3 střední, 1 malá
        arr = [big(), mid(), mid(), mid(), small()];
      }

      // zamíchej Fisher-Yates
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      gapQueue = arr;
    }
    function nextGapValue() {
      if (gapQueue.length === 0) buildGapQueue();
      return gapQueue.shift();
    }

      oc2.drawImage(avatarImg, 0, 0);
      const id = oc2.getImageData(0, 0, oc.width, oc.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const br = d[i] + d[i+1] + d[i+2];
        if (br < 60) d[i+3] = 0;
        else if (br < 120) d[i+3] = Math.round((br - 60) / 60 * 255);
      }
      oc2.putImageData(id, 0, 0);
      avatarCanvas = oc;

0PX5KxTCSN2HNcPkuAqSpqKSoZUUs8kEzDlr43FrgfIhbb0fx+1XaoY6S9xQXulYMc0oDZgP5h1+a1RuVL5jzF50Gaeq2f5P+mdQRyb9U6ZL6rVul+NWgrzytqqqazVDsDkqYyWZ8nNB/BXP+0NicxskN9t0jXAEYqWg48cE5VycZbpnBnQuqDxODX8fqWiGc56p3FUkFVCDUVoc/kbdKR57uWZp/NSlNcaaQgMqGO9HZU4iXRr1Et0WSOpJO5TuOp7I3VabXQg/4gOPNOmV8HID7xv1USii6N4yebUBKMqiNsqEZWQbEvH1SzKqHuck0ob7c0TbavzWYqs96h2VdOOrwPmsxW0rRl0jQPNwH4qHpQr6iiXFW3oSF8+KGeoUJJdbZHkyVtPGP4pQEwq9W6WpWl1Rf7bEB1Lqpg/NRqgJ9vnL5Vktgqx4odWgjIytb3Hizw5t5/vGrbaT4RvMh/ygqg6t9pjSNAwx2Chq7tNjZzm+6jB+e5+ibNNbtl1GN7cbQg/z2N/y1wa0uzsOpz0WpOJ3HzS2k2yUtHUC7XNuQYIHZa0j953QLmniBxu1xq5r6Z1Y22ULtvcUY5cj+J3UrWZJJJJJJ6kqqdx9xHXtOiS+a5ln6LguHE3iNqXiBcxVXuqxBGT7mlj2jj+XefMqnIQszbe7PQQhGEdMVhAhCFAwIQhAAhCEACEIQAIQhAAhCEACEIQALMySHGXuOBgbrBCAMg94OQ92fVLxV9dD/hVtTH/LKR+abIQQ0mScWoL7Ecx3m4N9Kl/9Us3VWpm9L/cx/wC5f/VQyFOWI6UHzFE3/a7VOMf2iun/ANp/9V9/tfqru1Hdh6Vb/wCqg0IyyOxT+6v0JiTVOpZPt6gujvWrf/VN5b3epRiW717x4OqXn81HoUDKlBcJCslTUSf4k8r/AOZ5KTyfFfEIGSSBCEIJBCEIAEIQgAQhCABCEIAEIQgD/9k=';

    let ball, pipes, coins, pipeCount, score, best, state, lastPipe;
    best = 0;

    function init() {
      ball = { y: H / 2, vy: 0 };
      pipes = [];
      score = 0;
      coins = 0;
      pipeCount = 0;
      state = 'idle';
      lastPipe = 0;
      
      gapQueue = [];
      scoreEl.textContent = 0;
      coinsEl.textContent = 0;
    }

    function spawnPipe() {
      const gap = nextGapValue();
      const minH = 50, maxH = H - 80 - 50 - gap;
      const topH = Math.floor(Math.random() * (maxH - minH) + minH);
      pipeCount++;
      // každá 5. trubka má penízek uprostřed mezery
      const hasCoin = (pipeCount % 5 === 0);
      const coinY = topH + gap / 2;
      pipes.push({ x: W + 10, topH, gap, scored: false, hasCoin, coinY, coinX: W + 10 + PIPE_W / 2, coinCollected: false });
    }

    function jump() {
      if (state === 'dead') { init(); return; }
      if (state === 'idle') state = 'playing';
      ball.vy = JUMP;
    }

    canvas.addEventListener('click', jump);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); jump(); }
    });

    function drawSky() {
      ctx.fillStyle = '#1a1f2e';
      ctx.fillRect(0, 0, W, H - 40);
      ctx.fillStyle = '#2a3042';
      ctx.fillRect(0, H - 40, W, 40);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath(); ctx.fill();
    }

    function drawPipe(p) {
      ctx.fillStyle = '#31694BFF';
      roundRect(p.x, 0, PIPE_W, p.topH, 5);
      roundRect(p.x, p.topH + p.gap, PIPE_W, H - p.topH - p.gap - 40, 5);
      ctx.fillStyle = '#0e3a2fFF';
      ctx.fillRect(p.x - 5, p.topH - 18, PIPE_W + 10, 18);
      ctx.fillRect(p.x - 5, p.topH + p.gap, PIPE_W + 10, 18);
    }

    function drawCoin(p) {
      if (!p.hasCoin || p.coinCollected) return;
      const cx = p.coinX, cy = p.coinY, r = 10;
      // glow
      ctx.save();
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 12;
      // vnější kroužek
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#f5c518';
      ctx.fill();
      // vnitřní odlesk
      ctx.beginPath();
      ctx.arc(cx - 3, cy - 3, r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,200,0.55)';
      ctx.fill();
      // symbol
      ctx.fillStyle = '#c8960a';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, cy);
      ctx.restore();
    }

    function drawAvatar() {
      const tilt = Math.max(-0.4, Math.min(0.4, ball.vy * 0.05));
      ctx.save();
      ctx.translate(BALL_X, ball.y + HIT_OY);
      ctx.rotate(tilt);
      if (avatarCanvas) {
        ctx.drawImage(avatarCanvas, -AV_W/2, -AV_H/2, AV_W, AV_H);
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, HIT_RX, HIT_RY, 0, 0, Math.PI*2);
        ctx.fillStyle = '#e8a53a'; ctx.fill();
      }
      ctx.restore();
    }

    function collidesEllipse(p) {
      const cx = BALL_X, cy = ball.y + HIT_OY;
      const rx = HIT_RX, ry = HIT_RY;
      function hits(bx, by, bw, bh) {
        const nx = Math.max(bx, Math.min(cx, bx+bw));
        const ny = Math.max(by, Math.min(cy, by+bh));
        const dx = (cx-nx)/rx, dy = (cy-ny)/ry;
        return dx*dx + dy*dy < 1;
      }
      if (hits(p.x-5, 0, PIPE_W+10, p.topH)) return true;
      if (hits(p.x-5, p.topH-18, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap+18, PIPE_W+10, H)) return true;
      return false;
    }

    function drawOverlay() {
      ctx.fillStyle = 'rgba(20,24,38,0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e0ddd5';
      ctx.font = '500 22px sans-serif';
      ctx.textAlign = 'center';
      if (state === 'idle') {
        ctx.fillText('Flappy ŠkoPilot', W/2, H/2 - 24);
        ctx.font = '400 15px sans-serif';
        ctx.fillStyle = '#c8c4bc';
        ctx.fillText('Klikni nebo stiskni Mezerník pro start', W/2, H/2 + 10);
      } else {
        ctx.fillText('Konec hry!', W/2, H/2 - 36);
        ctx.font = '400 15px sans-serif';
        ctx.fillStyle = '#c8c4bc';
        ctx.fillText('Skóre: ' + score + '   Nejlepší: ' + best, W/2, H/2);
        ctx.fillText('Klikni nebo Mezerník pro restart', W/2, H/2 + 28);
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      drawSky();
      if (state === 'playing') {
        ball.vy += GRAVITY;
        ball.y += ball.vy;
        if (now - lastPipe > PIPE_INTERVAL) { spawnPipe(); lastPipe = now; }
        for (let p of pipes) {
          p.x -= PIPE_SPEED;
          p.coinX -= PIPE_SPEED;
          if (!p.scored && p.x + PIPE_W < BALL_X) {
            p.scored = true; score++;
            scoreEl.textContent = score;
            if (score > best) { best = score; bestEl.textContent = best; }
          }
          // sbírání penízku
          if (p.hasCoin && !p.coinCollected) {
            const dx = BALL_X - p.coinX, dy = (ball.y + HIT_OY) - p.coinY;
            if (Math.sqrt(dx*dx + dy*dy) < HIT_RX + 10) {
              p.coinCollected = true;
              coins++;
              coinsEl.textContent = coins;
            }
          }
          if (collidesEllipse(p)) state = 'dead';
        }
        pipes = pipes.filter(p => p.x + PIPE_W > -10);
        if (ball.y + HIT_RY + HIT_OY > H - 40 || ball.y - HIT_RY + HIT_OY < 0) state = 'dead';
      }
      for (let p of pipes) drawPipe(p);
      for (let p of pipes) drawCoin(p);
      drawAvatar();
      if (state !== 'playing') drawOverlay();
    }

    init();
    requestAnimationFrame(loop);
  </script>
