; PlatformIO project for Cardputer GPS + LoRa Info
;
; Board: M5Stack Cardputer-Adv (StampS3A / ESP32-S3FN8, 8 MB flash)
; Cap  : M5Stack Cap LoRa-1262 (SX1262 + AT6668/ATGM336H)
;
;   pio run -t upload && pio device monitor

[platformio]
src_dir = .

[env:cardputer-adv]
platform  = espressif32@^6.9.0
board     = m5stack-stamps3
framework = arduino

board_build.flash_mode = qio
board_build.f_flash    = 80000000L
board_build.partitions = default_8MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Native USB CDC on the ESP32-S3, so Serial goes over the USB-C port.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    m5stack/M5Cardputer@^1.0.3
    mikalhart/TinyGPSPlus@^1.0.3
    jgromes/RadioLib@^6.6.0

; The sketch lives as a .ino next to this file; exclude nothing else.
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
