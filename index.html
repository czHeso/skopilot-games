<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŠkoPilot Family — Arcade</title>
<style>
  @font-face{ font-family:'PixelArcade'; src:url('assets/fonts/PressStart2P.ttf') format('truetype'); font-display:swap; }
  :root{
    --bg:#092725; --line:#1d4a44;
    --sage:#7e9a90; --sage2:#a9c4ba; --teal:#34625b;
    --white:#ffffff; --gold:#f5c518;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'PixelArcade','Courier New',monospace;
    overflow:hidden; height:100vh; user-select:none; cursor:default;
  }
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none;}
  /* CRT */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px,rgba(0,0,0,0) 4px);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    background:radial-gradient(ellipse at 50% 42%, transparent 56%, rgba(0,0,0,.45) 100%);}

  #screen{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;}

  /* topbar s logem */
  .topbar{padding:clamp(14px,3vh,34px) clamp(24px,4vw,64px) 0;}
  .logo{height:clamp(58px,12vh,128px);width:auto;display:block;}

  .main{flex:1;display:flex;align-items:center;gap:clamp(18px,3vw,56px);
        padding:clamp(6px,1.6vh,20px) clamp(24px,4vw,64px);min-height:0;}

  /* ===== HRY (vlevo) ===== */
  #games{flex:1.75;min-width:0;display:flex;flex-direction:column;
    justify-content:center;gap:clamp(12px,2.6vh,30px);}
  .cat-head{display:flex;align-items:center;gap:10px;
    font-size:clamp(9px,1.4vw,15px);color:var(--sage2);letter-spacing:3px;
    margin-bottom:clamp(8px,1.3vh,13px);}
  .cat-head::before{content:"";width:13px;height:13px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--sage2),var(--teal));clip-path:polygon(0 0,100% 0,70% 100%,0 100%);}
  .cat-head::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent);}

  .row{display:flex;flex-wrap:wrap;gap:clamp(10px,1.3vw,22px);}
  .two{display:flex;flex-wrap:wrap;gap:clamp(16px,2.6vw,44px);}
  .col{flex:1;min-width:180px;max-width:540px;}

  .card{width:clamp(108px,11.5vw,172px);display:flex;flex-direction:column;
    cursor:pointer;transition:transform .14s;}
  .frame{width:100%;aspect-ratio:4/3;position:relative;border-radius:11px;overflow:hidden;
    border:3px solid var(--line);background:#06201d;
    box-shadow:inset 0 0 0 2px var(--bg), 0 8px 18px rgba(0,0,0,.5);}
  .frame svg{display:block;width:100%;height:100%;}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(130% 70% at 50% -12%, rgba(255,255,255,.10), transparent 58%),
      repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 3px,rgba(0,0,0,0) 4px);}
  .cap{margin-top:9px;font-size:clamp(7px,.9vw,11px);color:var(--sage);letter-spacing:1px;line-height:1.5;}
  .genre{margin-top:5px;font-size:clamp(6px,.78vw,8px);color:var(--teal);letter-spacing:1px;}
  .hi{margin-top:4px;font-size:clamp(6px,.78vw,8px);color:#3c5a52;letter-spacing:1px;}

  .card.sel{transform:translateY(-7px) scale(1.05);}
  .card.sel .frame{border-color:var(--sage2);
    box-shadow:inset 0 0 0 2px var(--bg),0 0 26px rgba(169,196,186,.55),0 8px 18px rgba(0,0,0,.5);}
  .card.sel .cap{color:var(--sage2);}
  .card.sel .hi{color:var(--gold);}
  .card.sel .frame::before{content:"\25B6 PLAY";position:absolute;z-index:3;left:50%;bottom:8px;
    transform:translateX(-50%);background:var(--sage2);color:var(--bg);
    font-size:clamp(7px,.9vw,10px);padding:4px 9px;border-radius:4px;letter-spacing:1px;
    animation:blink .5s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .card.soon{cursor:not-allowed;}
  .card.soon .frame{filter:saturate(.5) brightness(.78);}
  .card.soon .frame::before{content:"SOON";position:absolute;z-index:3;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(14px,2.2vw,28px);color:var(--white);letter-spacing:4px;
    text-shadow:0 0 12px rgba(0,0,0,.9),2px 2px 0 var(--teal);background:rgba(6,32,29,.32);}
  .ribbon{position:absolute;z-index:4;top:9px;right:-28px;transform:rotate(45deg);
    background:var(--gold);color:var(--bg);font-size:clamp(6px,.8vw,9px);
    letter-spacing:2px;padding:3px 32px;box-shadow:0 2px 6px rgba(0,0,0,.4);}

  /* ===== MASKOT (vpravo) ===== */
  #hero{flex:1;min-width:0;align-self:stretch;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:clamp(6px,2vh,22px);}
  .spot{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
    width:96%;height:88%;
    background:radial-gradient(ellipse at center, rgba(169,196,186,.20), rgba(126,154,144,.05) 46%, transparent 70%);
    filter:blur(3px);pointer-events:none;}
  .mascot{position:relative;z-index:2;width:auto;
    max-height:clamp(220px,56vh,560px);max-width:96%;
    filter:drop-shadow(0 20px 16px rgba(0,0,0,.5));
    animation:bob 3.4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-12px);}}
  .pedestal{position:relative;z-index:1;margin-top:-6px;
    width:46%;height:18px;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(169,196,186,.4), rgba(52,98,91,.16) 55%, transparent 72%);}
  .start{position:relative;z-index:2;margin-top:clamp(8px,1.6vh,16px);
    font-size:clamp(12px,1.8vw,20px);color:var(--white);letter-spacing:3px;
    animation:blink 1.05s steps(1) infinite;}

  /* ===== PATIČKA ===== */
  .foot{z-index:3;display:flex;flex-direction:column;gap:6px;align-items:center;
    padding:0 12px clamp(10px,2.2vh,22px);}
  .hint{font-size:clamp(6px,1vw,10px);color:var(--teal);letter-spacing:1px;}
  .credit{font-size:clamp(6px,1vw,9px);color:#24514a;letter-spacing:1px;}

  /* ===== PORTRÉT / ÚZKÁ OBRAZOVKA ===== */
  @media (max-aspect-ratio:1/1), (max-width:820px){
    .main{flex-direction:column-reverse;gap:clamp(8px,2vh,18px);overflow-y:auto;}
    #hero{flex:0 0 auto;align-self:center;}
    .mascot{max-height:clamp(120px,22vh,210px);}
    .start{display:none;}
    .topbar{display:flex;justify-content:center;}
    .row{justify-content:center;}
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div id="screen">
    <div class="topbar">
      <img class="logo" src="assets/logo_t.png"
           onerror="this.onerror=null;this.src='assets/logo.png'" alt="ŠkoPilot Family">
    </div>

    <div class="main">
      <!-- HRY -->
      <div id="games">
        <div>
          <div class="cat-head">ŠKOPILOT</div>
          <div class="row" id="row-games"></div>
        </div>
        <div class="two">
          <div class="col">
            <div class="cat-head">ŠKOPILOT CLIP</div>
            <div class="row" id="row-clip"></div>
          </div>
          <div class="col">
            <div class="cat-head">ŠKOPILOT PRO</div>
            <div class="row" id="row-pro"></div>
          </div>
        </div>
      </div>

      <!-- MASKOT -->
      <div id="hero">
        <div class="spot"></div>
        <img class="mascot" src="assets/skopilot.png"
             onerror="this.onerror=null;this.src='invaders/skopilotHead.png'" alt="ŠkoPilot">
        <div class="pedestal"></div>
        <div class="start">PUSH START</div>
      </div>
    </div>

    <div class="foot">
      <div class="hint">JOYSTICK / &larr;&rarr; SELECT &nbsp;&middot;&nbsp; START / ENTER PLAY &nbsp;&middot;&nbsp; ESC = MENU</div>
      <div class="credit">&copy; 2026 ŠKODA &middot; ŠKOPILOT FAMILY</div>
    </div>
  </div>

<script>
  const HEAD = 'invaders/skopilotHead.png';

  const ART = {
    flappy:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <rect y="108" width="160" height="12" fill="#0d2c1d"/>
      <g fill="#2fc56f"><rect x="98" y="0" width="28" height="40"/><rect x="98" y="80" width="28" height="28"/></g>
      <g fill="#0d4631"><rect x="94" y="36" width="36" height="9"/><rect x="94" y="80" width="36" height="9"/></g>
      <circle cx="140" cy="62" r="9" fill="#f5c518"/>
      <text x="140" y="66" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8960a" text-anchor="middle">$</text>
      <image href="${HEAD}" x="40" y="46" width="34" height="34"/></svg>`,

    invaders:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <g fill="#1f5a3d"><rect x="12" y="14" width="2" height="2"/><rect x="44" y="8" width="2" height="2"/>
        <rect x="120" y="20" width="2" height="2"/><rect x="148" y="40" width="2" height="2"/>
        <rect x="70" y="30" width="2" height="2"/><rect x="100" y="52" width="2" height="2"/></g>
      <g>${[0,1,2].map(r=>[0,1,2,3].map(c=>{const x=30+c*30,y=18+r*20,col=['#62e29a','#2fc56f','#27b063'][r];
        return `<g transform="translate(${x},${y})" fill="${col}"><rect x="-9" y="-6" width="18" height="12" rx="4"/>
        <rect x="-11" y="2" width="4" height="5"/><rect x="7" y="2" width="4" height="5"/>
        <circle cx="-4" cy="-1" r="2.2" fill="#06150d"/><circle cx="4" cy="-1" r="2.2" fill="#06150d"/></g>`;}).join('')).join('')}</g>
      <g fill="#ffff88"><rect x="79" y="78" width="2" height="8"/></g>
      <polygon points="80,108 74,116 86,116" fill="#2fc56f"/>
      <image href="${HEAD}" x="66" y="88" width="28" height="28"/></svg>`,

    snake:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <g stroke="#0f2c1e" stroke-width="1">${[20,40,60,80,100,120,140].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="120"/>`).join('')}
        ${[20,40,60,80,100].map(y=>`<line x1="0" y1="${y}" x2="160" y2="${y}"/>`).join('')}</g>
      <g fill="#2fc56f"><rect x="22" y="62" width="16" height="16" rx="5"/><rect x="40" y="62" width="16" height="16" rx="5"/>
        <rect x="58" y="62" width="16" height="16" rx="5"/><rect x="58" y="44" width="16" height="16" rx="5"/>
        <rect x="76" y="44" width="16" height="16" rx="5"/></g>
      <image href="${HEAD}" x="94" y="42" width="20" height="20"/>
      <circle cx="128" cy="84" r="9" fill="#f5c518"/>
      <text x="128" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8960a" text-anchor="middle">$</text></svg>`,

    breakout:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <g>${['#0d4631','#1c7a4a','#27b063','#2fc56f'].map((col,r)=>[0,1,2,3,4,5].map(c=>{const x=10+c*24,y=14+r*14,
        gold=(r===1&&c===3)||(r===2&&c===1);return `<rect x="${x}" y="${y}" width="22" height="10" rx="2" fill="${gold?'#f5c518':col}"/>`;}).join('')).join('')}</g>
      <circle cx="96" cy="84" r="5" fill="#eef6f4"/>
      <rect x="60" y="100" width="46" height="9" rx="4" fill="#2fc56f"/>
      <image href="${HEAD}" x="74" y="96" width="18" height="18"/></svg>`,

    skoman:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <g fill="#0c3a26" stroke="#2fc56f" stroke-opacity=".5">
        <rect x="8" y="10" width="42" height="14" rx="5"/><rect x="110" y="10" width="42" height="14" rx="5"/>
        <rect x="66" y="38" width="28" height="20" rx="5"/><rect x="8" y="92" width="46" height="14" rx="5"/>
        <rect x="106" y="92" width="46" height="14" rx="5"/></g>
      <g fill="#f5e6a8">${[20,36,52,84,100,116,132].map(x=>`<circle cx="${x}" cy="76" r="2.4"/>`).join('')}</g>
      <circle cx="24" cy="34" r="5" fill="#b8f5da"/>
      <image href="${HEAD}" x="52" y="64" width="26" height="26"/>
      <g transform="translate(122,76)"><path d="M-9,2 A9,9 0 0 1 9,2 L9,9 L6,6 L3,9 L0,6 L-3,9 L-6,6 L-9,9 Z" fill="#ff6a6a"/>
        <circle cx="-3" cy="0" r="2.4" fill="#fff"/><circle cx="3" cy="0" r="2.4" fill="#fff"/>
        <circle cx="-3" cy="0" r="1.1" fill="#1b2a6b"/><circle cx="3" cy="0" r="1.1" fill="#1b2a6b"/></g></svg>`,

    cliptris:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <rect x="52" y="6" width="56" height="108" fill="#08231f" stroke="#1d4a44" stroke-width="2"/>
      <g><rect x="54" y="92" width="18" height="18" fill="#7e9a90"/><rect x="72" y="92" width="18" height="18" fill="#34625b"/>
        <rect x="90" y="92" width="18" height="18" fill="#a9c4ba"/><rect x="54" y="74" width="18" height="18" fill="#34625b"/>
        <rect x="90" y="74" width="18" height="18" fill="#f5c518"/><rect x="72" y="56" width="18" height="18" fill="#7e9a90"/>
        <rect x="90" y="56" width="18" height="18" fill="#34625b"/></g>
      <g fill="#a9c4ba"><rect x="72" y="14" width="18" height="18"/><rect x="72" y="32" width="18" height="18"/>
        <rect x="90" y="32" width="18" height="18"/></g></svg>`,

    pro:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#06201d"/>
      <g transform="translate(80,52)"><rect x="-20" y="-4" width="40" height="34" rx="6" fill="#0c302c" stroke="#34625b" stroke-width="2"/>
        <path d="M-12,-4 v-8 a12,12 0 0 1 24,0 v8" fill="none" stroke="#7e9a90" stroke-width="4"/>
        <circle cx="0" cy="11" r="4" fill="#a9c4ba"/><rect x="-2" y="11" width="4" height="9" fill="#a9c4ba"/></g>
      <text x="80" y="100" font-family="'PixelArcade',monospace" font-size="12" fill="#7e9a90" text-anchor="middle" letter-spacing="2">PRO</text></svg>`,
  };

  const GAMES = [
    { title:'FLAPPY ŠKOPILOT', genre:'FLY &amp; DODGE',   url:'flappy/index.html',   hi:'sko_flappy_best',   art:ART.flappy },
    { title:'ŠKOINVADERS',     genre:'SHOOT INVADERS',    url:'invaders/index.html', hi:'sko_invaders_best', art:ART.invaders },
    { title:'ŠKOSNAKE',        genre:'COLLECT COINS',     url:'snake/index.html',    hi:'sko_snake_best',    art:ART.snake },
    { title:'ŠKOBREAKOUT',     genre:'SMASH BRICKS',      url:'breakout/index.html', hi:'sko_breakout_best', art:ART.breakout },
    { title:'ŠKOMAN',          genre:'MAZE &amp; GHOSTS', url:'skoman/index.html',   hi:'sko_man_best',      art:ART.skoman },
  ];

  const rowGames=document.getElementById('row-games');
  let sel=0;
  GAMES.forEach((g,i)=>{
    const hi=localStorage.getItem(g.hi)||0;
    const card=document.createElement('div');
    card.className='card'+(i===0?' sel':'');
    card.innerHTML='<div class="frame">'+g.art+'</div>'+
      '<div class="cap">'+g.title+'</div><div class="genre">'+g.genre+'</div>'+
      '<div class="hi">HI '+String(hi).padStart(5,'0')+'</div>';
    card.addEventListener('click',()=>{ sel=i; render(); launch(); });
    card.addEventListener('mouseenter',()=>{ sel=i; render(); });
    rowGames.appendChild(card);
  });
  const cards=[...rowGames.querySelectorAll('.card')];
  function render(){ cards.forEach((c,i)=>c.classList.toggle('sel', i===sel)); }
  function launch(){ window.location.href=GAMES[sel].url; }

  document.getElementById('row-clip').innerHTML=
    '<div class="card soon" title="Coming soon"><div class="frame"><div class="ribbon">SOON</div>'+ART.cliptris+'</div>'+
    '<div class="cap">CLIPTRIS</div><div class="genre">STACK THE BLOCKS</div><div class="hi">COMING SOON</div></div>';
  document.getElementById('row-pro').innerHTML=
    '<div class="card soon" title="Coming soon"><div class="frame"><div class="ribbon">SOON</div>'+ART.pro+'</div>'+
    '<div class="cap">ŠKOPILOT PRO</div><div class="genre">MORE TO COME</div><div class="hi">COMING SOON</div></div>';

  document.addEventListener('keydown',e=>{
    switch(e.key){
      case 'ArrowRight': case 'd': case 'ArrowDown': case 's': sel=(sel+1)%GAMES.length; render(); break;
      case 'ArrowLeft': case 'a': case 'ArrowUp': case 'w': sel=(sel-1+GAMES.length)%GAMES.length; render(); break;
      case 'Enter': case ' ': e.preventDefault(); launch(); break;
    }
  });

  // === jemné stoupající jiskřičky ===
  const fx=document.getElementById('fx'), fc=fx.getContext('2d');
  let parts=[];
  function resizeFx(){
    fx.width=window.innerWidth; fx.height=window.innerHeight;
    parts=[];
    const n=Math.round(fx.width/30);
    for(let i=0;i<n;i++) parts.push({x:Math.random()*fx.width,y:Math.random()*fx.height,
      s:Math.random()<.2?2:1, v:0.12+Math.random()*0.45, a:0.15+Math.random()*0.4});
  }
  window.addEventListener('resize', resizeFx); resizeFx();
  (function fxLoop(){
    requestAnimationFrame(fxLoop);
    fc.clearRect(0,0,fx.width,fx.height);
    for(const p of parts){
      p.y-=p.v; if(p.y<-4){ p.y=fx.height+4; p.x=Math.random()*fx.width; }
      fc.globalAlpha=p.a; fc.fillStyle=p.s===2?'#a9c4ba':'#356057';
      fc.fillRect(p.x|0,p.y|0,p.s,p.s);
    }
    fc.globalAlpha=1;
  })();

  window.addEventListener('gamepadconnected', ()=>{
    let prev=0;
    (function poll(){
      const gp=navigator.getGamepads()[0];
      if(gp){ const x=gp.axes[0]||0, now=Date.now();
        if(now-prev>220){ if(x>0.5){sel=(sel+1)%GAMES.length;render();prev=now;}
          else if(x<-0.5){sel=(sel-1+GAMES.length)%GAMES.length;render();prev=now;} }
        if(gp.buttons.some(b=>b.pressed)) launch(); }
      requestAnimationFrame(poll);
    })();
  });
</script>
</body>
</html>
