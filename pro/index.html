<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ŠkoPilot Pro — Agent Builder</title>
  <style>
    @font-face{ font-family:'PixelArcade'; src:url('../assets/fonts/PressStart2P.ttf') format('truetype'); font-display:swap; }
    *{margin:0;padding:0;box-sizing:border-box;}
    *{cursor:none !important;}   /* kiosk: hide mouse cursor (Wayland-safe) */
    /* hall of fame: allow the mouse so records can be deleted by clicking */
    body.allow-cursor, body.allow-cursor *{cursor:auto !important;}
    html,body{height:100%;}
    body{background:#040b09;display:flex;align-items:center;justify-content:center;height:100vh;
      overflow:hidden;font-family:'PixelArcade','Courier New',monospace;color:#eef6f4;user-select:none;
      image-rendering:pixelated;}
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse at 50% 40%, rgba(8,30,24,.4), rgba(4,11,9,.94) 80%),
                 url('../assets/8bit/circuit.jpg') center/cover no-repeat; opacity:.4;}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);}
    #stage{transform-origin:center center;position:relative;z-index:3;}
    canvas{display:block;background:#06201d;border:3px solid #155047;image-rendering:pixelated;
      box-shadow:0 0 0 3px #040b09, 0 0 0 5px #0c3329, 0 0 36px rgba(57,255,140,.24);}
    #menuBtn{position:fixed;top:14px;left:14px;z-index:60;background:#0c2418;color:#c9ffe2;
      border:2px solid #1f9c5e;padding:9px 14px;font-size:10px;letter-spacing:1px;
      cursor:pointer;font-family:inherit;box-shadow:0 0 0 2px #040b09, 0 0 14px rgba(57,255,140,.25);}
    #menuBtn:hover{background:#11331f;color:#39ff8c;}
    #controlsHelp{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      width:auto; height:auto;
      max-width:min(82vw,1200px); max-height:32vh;
      z-index:40; pointer-events:none; display:none;
      image-rendering:auto;
      filter:drop-shadow(0 8px 30px rgba(57,255,140,.5)) brightness(.95);
    }
    #controlsHelp.show{ display:block; animation:helpFade .4s ease-out both; }
    @keyframes helpFade{
      from{ opacity:0; transform:translate(-50%, 14px); }
      to{ opacity:1; transform:translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <button id="menuBtn" onclick="location.href='../index.html'">&#9664; MENU</button>
  <img id="controlsHelp" src="../assets/controls-3.png" alt="ovládání"
       onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='../assets/controls.png';}else{this.style.display='none';this.dataset.missing='1';}">
  <div id="stage"><canvas id="c" width="800" height="600"></canvas></div>
<script>
/* ===================== INPUT MANAGER (config) ===================== */
/* Arcade1Up bývá mapovaný jako USB klávesnice. Uprav podle svého enkodéru. */
const KEYMAP = {
  left:  ['ArrowLeft','a','A'],
  right: ['ArrowRight','d','D'],
  up:    ['ArrowUp','w','W'],
  down:  ['ArrowDown','s','S'],
  jump:  [' ','z','Z','ArrowUp','w','W','Control'],   // tlačítko A / páčka nahoru
  shoot: ['x','X','Alt','Shift'],                      // tlačítko B
  start: ['Enter',' '],
  menu:  ['Escape'],
};
const action = {}; const justAction = {};
function setActions(key,val,track){
  for(const a in KEYMAP){ if(KEYMAP[a].includes(key)){ if(val && !action[a] && track) justAction[a]=true; action[a]=val; } }
}
addEventListener('keydown',e=>{
  if(KEYMAP.menu.includes(e.key)){ location.href='../index.html'; return; }
  if(state==='scores') bumpScores();
  if(state==='enter'){
    if(entryConfirm){
      if(e.key==='Backspace'){ e.preventDefault(); entryConfirm=false; return; }
      /* ostatní klávesy projdou na akce (šipky = NO/YES, start = potvrdit) */
    } else {
      // direct typing (keyboard): letters, digits 1-9, '-' and '/'
      if(/^[a-zA-Z0-9\/-]$/.test(e.key)){
        e.preventDefault();
        const ch=e.key.toUpperCase();
        if(NAME_CHARS.includes(ch)){ entryName[entryPos]=ch; if(entryPos<NAME_LEN-1) entryPos++; }
        return;
      }
      if(e.key==='Backspace'){
        e.preventDefault();
        if(entryName[entryPos]===' ' && entryPos>0) entryPos--;
        entryName[entryPos]=' ';
        return;
      }
    }
  }
  if(state==='title' && e.key==='Backspace'){ e.preventDefault(); openScores(); return; }
  if(state==='scores' && e.key==='Delete'){
    if(!delConfirm){ if(manage) activateManage(); else enterManage(); }
    return;
  }
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  setActions(e.key,true,true);
});
addEventListener('keyup',e=>setActions(e.key,false,false));
function consume(a){ if(justAction[a]){ justAction[a]=false; return true; } return false; }
/* držení joysticku = opakování (arcade name entry): první stisk hned, pak po krátké prodlevě auto-repeat */
const REPEAT_DELAY=22, REPEAT_RATE=5; const heldFrames={};
function repeatAction(a){
  if(!action[a]){ heldFrames[a]=0; return false; }
  if(justAction[a]){ justAction[a]=false; heldFrames[a]=0; return true; }
  heldFrames[a]=(heldFrames[a]||0)+1;
  return heldFrames[a]>=REPEAT_DELAY && (heldFrames[a]-REPEAT_DELAY)%REPEAT_RATE===0;
}
/* síň slávy: po 60 s nečinnosti zpět na úvodní obrazovku (attract mode) */
const SCORES_TIMEOUT=60000; let scoresActivityTs=0;
function bumpScores(){ scoresActivityTs=performance.now(); }

/* ===================== SETUP ===================== */
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');
const W=canvas.width, H=canvas.height;
function fit(){ const s=Math.min(innerWidth/stage.offsetWidth, innerHeight/stage.offsetHeight); stage.style.transform='scale('+s+')'; }
addEventListener('resize',fit); addEventListener('load',fit); fit();

const headImg=new Image(); headImg.src='../assets/skopilotHead.png';
const playerImg=new Image(); playerImg.src='../assets/skopilot_run.png';
const enemyImgs={};
['bug','machine','email','paper'].forEach(k=>{ const im=new Image(); im.src='../assets/8bit/enemies/'+k+'.png'; enemyImgs[k]=im; });
function enemySprite(kind){
  if(kind==='email') return enemyImgs.email;
  if(kind==='paper') return enemyImgs.paper;
  if(kind==='arm'||kind==='delay') return enemyImgs.machine;
  return enemyImgs.bug;   // syntax / legacy / default
}
const itemImgs={};
['floppy','coffee','shield'].forEach(k=>{ const im=new Image(); im.src='../assets/8bit/items/'+k+'.png'; itemImgs[k]=im; });
const bgImgs={};
['it','factory','hr'].forEach(k=>{ const im=new Image(); im.src='../assets/8bit/bg/'+k+'.png'; bgImgs[k]=im; });
const carImgs=['car_green','car_silver','car_white'].map(k=>{ const im=new Image(); im.src='../assets/8bit/items/'+k+'.png'; return im; });

/* ===================== CONSTANTS ===================== */
/* mírnější fyzika: vyšší a delší skok, ať jsou všechny skoky pohodlné */
const GRAV=0.58, MAXV=13, SPEED=3.3, JUMP=-13.8, STEP=1000/60;
const PLAYER_W=30, PLAYER_H=38;

/* ===================== LEVELS ===================== */
function baseGround(){ return {x:0,y:560,w:800,h:40}; }
const LEVELS=[
  { name:'1. IT & DEV', theme:'it', accent:'#39ff8c', wall:'#0d4631', time:60, agent:'CODER AGENT',
    platforms:[ baseGround(),
      {x:90,y:452,w:170,h:18},{x:340,y:392,w:150,h:18},{x:560,y:322,w:180,h:18},
      {x:120,y:262,w:150,h:18},{x:380,y:200,w:170,h:18} ],
    tools:[ {x:150,y:420,label:'.py'},{x:610,y:290,label:'API'},{x:430,y:168,label:'<>'} ],
    enemies:[ {x:300,y:524,minX:200,maxX:520,vx:0.9,kind:'syntax'},
              {x:380,y:356,minX:345,maxX:470,vx:0.7,kind:'legacy'} ],
    powerups:[ {x:200,y:230,type:'coffee'} ],
    chassis:{x:445,y:146} },

  { name:'2. FACTORY', theme:'factory', accent:'#ffd23f', wall:'#5a4a12', time:55, agent:'FACTORY OPTIMIZER',
    platforms:[ baseGround(),
      {x:60,y:470,w:140,h:18},{x:280,y:420,w:150,h:18},{x:500,y:380,w:150,h:18},
      {x:300,y:280,w:200,h:18},{x:600,y:230,w:150,h:18} ],
    tools:[ {x:110,y:438,label:'SNS'},{x:560,y:348,label:'AI'},{x:660,y:198,label:'PRD'} ],
    enemies:[ {x:300,y:524,minX:120,maxX:640,vx:1.1,kind:'arm'},
              {x:340,y:244,minX:305,maxX:480,vx:0.8,kind:'delay'},
              {x:540,y:344,minX:505,maxX:640,vx:0.9,kind:'arm'} ],
    powerups:[ {x:360,y:248,type:'firewall'} ],
    chassis:{x:355,y:226} },

  { name:'3. HR OFFICE', theme:'hr', accent:'#7dffb4', wall:'#234a44', time:55, agent:'HR HELPER',
    platforms:[ baseGround(),
      {x:120,y:470,w:150,h:18},{x:360,y:430,w:140,h:18},{x:150,y:350,w:150,h:18},
      {x:420,y:320,w:170,h:18},{x:620,y:260,w:140,h:18} ],
    tools:[ {x:180,y:438,label:'PDF'},{x:470,y:288,label:'='},{x:670,y:228,label:'TXT'} ],
    enemies:[ {x:300,y:524,minX:120,maxX:660,vx:1.0,kind:'email'},
              {x:170,y:314,minX:155,maxX:280,vx:0.8,kind:'paper'},
              {x:450,y:284,minX:425,maxX:570,vx:1.0,kind:'email'} ],
    powerups:[ {x:640,y:228,type:'coffee'} ],
    chassis:{x:660,y:206} },
];

/* ===================== STATE ===================== */
let state, tick, score, lives, levelIdx, lvl, timeLeft;
let player, tools, enemies, powerups, chassis, shots, particles;
let shootCd, invuln, speedBoost, firewall, clearTimer;
let best=+localStorage.getItem('sko_pro_best')||0;

function loadScores(){ try{ return JSON.parse(localStorage.getItem('sko_pro_scores'))||[]; }catch(e){ return []; } }
function saveScores(s){ localStorage.setItem('sko_pro_scores', JSON.stringify(s)); }
let scores=loadScores();
/* seed jen při úplně prvním spuštění — smazaná tabulka zůstane prázdná */
if(localStorage.getItem('sko_pro_scores')===null){ scores=[{n:'SKO',s:3000},{n:'PIL',s:2000},{n:'OT0',s:1200},{n:'AAA',s:600},{n:'BUG',s:200}]; saveScores(scores); }

/* jméno: až 5 znaků — A-Z, 1-9, '-', '/' a prázdno (mezera); koncové mezery se ořežou */
const NAME_LEN=5;
const NAME_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789-/ ';
function resetEntry(){ entryName=['A',' ',' ',' ',' ']; entryPos=0; entryConfirm=false; entryYes=false; }
function cycleChar(dir){
  let i=NAME_CHARS.indexOf(entryName[entryPos]); if(i<0)i=0;
  entryName[entryPos]=NAME_CHARS[(i+dir+NAME_CHARS.length)%NAME_CHARS.length];
}

/* správa síně slávy: podmenu MANAGE RECORDS (smazat jeden / smazat vše) */
let scoreSel=-1, delConfirm=false, delYes=false, manage=false;
/* řádky: hlavní pohled = záznamy + MANAGE; manage = záznamy + DELETE ALL + BACK */
function scRows(){ return manage ? scores.length+2 : scores.length+1; }
function openScores(){ scoreSel=-1; delConfirm=false; manage=false; state='scores'; bumpScores(); }
function enterManage(){ manage=true; delConfirm=false; scoreSel=scores.length?0:1; }
function activateManage(){
  if(scoreSel===scores.length+1){ manage=false; scoreSel=-1; }   // BACK
  else if(scoreSel>=0){ delConfirm=true; delYes=false; }         // záznam / DELETE ALL
}
function doDelete(){
  if(scoreSel===scores.length){               // DELETE ALL
    scores=[]; saveScores(scores);
    best=0; localStorage.removeItem('sko_pro_best');
    scoreSel=1;                               // skoč na BACK
  } else if(scoreSel>=0 && scoreSel<scores.length){
    scores.splice(scoreSel,1); saveScores(scores);
  }
  if(scoreSel>scores.length+1) scoreSel=scores.length+1;
}

function loadLevel(i){
  lvl=LEVELS[i];
  timeLeft=lvl.time;
  player={x:60,y:500,w:PLAYER_W,h:PLAYER_H,vx:0,vy:0,onGround:false,face:1};
  tools=lvl.tools.map(t=>({x:t.x,y:t.y,w:22,h:22,label:t.label,got:false}));
  enemies=lvl.enemies.map(e=>({x:e.x,y:e.y,w:30,h:26,minX:e.minX,maxX:e.maxX,vx:e.vx,kind:e.kind,alive:true}));
  powerups=lvl.powerups.map(p=>({x:p.x,y:p.y,w:24,h:24,type:p.type,got:false}));
  chassis={x:lvl.chassis.x,y:lvl.chassis.y,w:50,h:58};
  shots=[]; particles=[];
  shootCd=0; invuln=0; speedBoost=0; firewall=0;
}

function startGame(){ score=0; lives=3; levelIdx=0; loadLevel(0); state='play'; }
function initTitle(){ state='title'; tick=0; }

/* ===================== HELPERS ===================== */
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function burst(x,y,col,n=10){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.5;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,col}); } }

function toolsLeft(){ return tools.filter(t=>!t.got).length; }

/* ===================== UPDATE ===================== */
function update(){
  tick++;
  if(state==='title'){ if(consume('up')){ openScores(); return; } if(consume('start')) startGame(); return; }
  if(state==='clear'){ clearTimer--; for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.02;}
    particles=particles.filter(p=>p.life>0);
    if(clearTimer<=0){ levelIdx++; if(levelIdx>=LEVELS.length){ victory(); } else { loadLevel(levelIdx); state='play'; } } return; }
  if(state==='gameover'){ if(consume('start')) maybeEnterScore(); return; }
  if(state==='enter'){ updateEnter(); return; }
  if(state==='scores'){ updateScores(); return; }

  /* ----- PLAY ----- */
  timeLeft -= STEP/1000;
  if(timeLeft<=0){ timeLeft=0; return gameOver(); }
  if(invuln>0) invuln--;
  if(speedBoost>0) speedBoost--;
  if(firewall>0) firewall--;
  if(shootCd>0) shootCd--;

  const spd = SPEED*(speedBoost>0?1.6:1);
  player.vx=0;
  if(action.left){ player.vx=-spd; player.face=-1; }
  if(action.right){ player.vx=spd; player.face=1; }
  if(consume('jump') && player.onGround){ player.vy=JUMP; player.onGround=false; }
  // dash (down+shoot nebo Shift): krátký impuls — využijeme shoot tlačítko jen na střelbu, dash na 'down'+jump? necháme jednoduché
  if(consume('shoot') && shootCd<=0){
    shots.push({x:player.x+player.w/2,y:player.y+player.h*0.45,vx:player.face*7,w:10,h:5});
    shootCd=16;
  }

  // pohyb hráče + kolize
  const plats=lvl.platforms;
  player.x+=player.vx;
  if(player.x<0)player.x=0; if(player.x+player.w>W)player.x=W-player.w;
  for(const p of plats){ if(aabb(player,p)){ if(player.vx>0)player.x=p.x-player.w; else if(player.vx<0)player.x=p.x+p.w; } }
  player.vy+=GRAV; if(player.vy>MAXV)player.vy=MAXV;
  player.y+=player.vy; player.onGround=false;
  for(const p of plats){ if(aabb(player,p)){ if(player.vy>0){player.y=p.y-player.h;player.onGround=true;} else if(player.vy<0){player.y=p.y+p.h;} player.vy=0; } }
  if(player.y>H+60){ hit(true); }

  // tooly
  for(const t of tools){ if(!t.got && aabb(player,t)){ t.got=true; score+=100; burst(t.x+11,t.y+11,'#f5c518',8); } }
  // powerupy
  for(const pu of powerups){ if(!pu.got && aabb(player,pu)){ pu.got=true; score+=25; burst(pu.x+12,pu.y+12,'#b8f5da',8);
    if(pu.type==='coffee') speedBoost=60*6; if(pu.type==='firewall') firewall=60*6; } }

  // střely
  for(const s of shots){ s.x+=s.vx; }
  shots=shots.filter(s=>s.x>-20&&s.x<W+20);
  for(const s of shots){ for(const e of enemies){ if(e.alive && aabb(s,e)){ e.alive=false; s.x=-999; score+=50; burst(e.x+15,e.y+13,'#ff6a6a',10); } } }

  // nepřátelé (bugi)
  for(const e of enemies){ if(!e.alive)continue; e.x+=e.vx; if(e.x<e.minX){e.x=e.minX;e.vx*=-1;} if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.vx*=-1;}
    if(invuln<=0 && firewall<=0 && aabb(player,e)){ hit(false); } }

  // chassis -> level clear
  if(toolsLeft()===0 && aabb(player,chassis)){ levelClear(); }

  // částice
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03;}
  particles=particles.filter(p=>p.life>0);
}

function hit(fell){
  lives--; invuln=60*1.5;
  burst(player.x+player.w/2,player.y+player.h/2,'#ff6a6a',14);
  player.x=60; player.y=500; player.vx=0; player.vy=0;
  if(lives<=0) gameOver();
}

function levelClear(){
  score += Math.floor(timeLeft)*10 + 300;   // časový bonus + stavba agenta
  if(score>best){ best=score; localStorage.setItem('sko_pro_best',best); }
  burst(chassis.x+25,chassis.y+20,lvl.accent,26);
  state='clear'; clearTimer=80;   // ~1.3 s mezi-levelová animace
}
function victory(){ state='gameover'; victoryFlag=true; }
let victoryFlag=false;

function gameOver(){
  if(score>best){ best=score; localStorage.setItem('sko_pro_best',best); }
  state='gameover';
}

/* ----- HIGH SCORE ENTRY ----- */
let entryName, entryPos;
/* potvrzení před uložením jména (ochrana proti omylem zmáčknutému B) */
let entryConfirm=false, entryYes=false;
function maybeEnterScore(){
  const min = scores.length<5 ? -1 : scores[scores.length-1].s;
  if(score>min){ resetEntry(); state='enter'; }
  else openScores();
}
function updateEnter(){
  if(entryConfirm){
    if(consume('left')||consume('right')) entryYes=!entryYes;
    consume('up'); consume('down'); consume('jump');   // zahodit, ať neprosáknou do dalšího stavu
    if(consume('shoot')||consume('start')){
      if(entryYes){
        scores.push({n:entryName.join('').trim()||'AAA',s:score});
        scores.sort((a,b)=>b.s-a.s); scores=scores.slice(0,5); saveScores(scores);
        openScores();
      } else entryConfirm=false;
    }
    return;
  }
  if(repeatAction('up')) cycleChar(1);
  if(repeatAction('down')) cycleChar(-1);
  if(repeatAction('right')){ entryPos=(entryPos+1)%NAME_LEN; }
  if(repeatAction('left')){ entryPos=(entryPos+NAME_LEN-1)%NAME_LEN; }
  if(consume('start')){ entryConfirm=true; entryYes=false; }
}

/* ----- HALL OF FAME (MANAGE RECORDS podmenu) ----- */
function updateScores(){
  if(delConfirm){
    if(consume('left')||consume('right')) delYes=!delYes;
    if(consume('shoot')||consume('start')){ if(delYes) doDelete(); delConfirm=false; }
    return;
  }
  if(manage){
    const items=scores.length+2;
    if(consume('down')) scoreSel=(scoreSel+1)%items;
    if(consume('up')) scoreSel=(scoreSel<=0?items:scoreSel)-1;
    if(consume('shoot')||consume('start')) activateManage();
    return;
  }
  if(consume('up')||consume('down')) scoreSel = scoreSel===scores.length ? -1 : scores.length;
  if(consume('shoot')) enterManage();
  if(consume('start')){ if(scoreSel===scores.length) enterManage(); else initTitle(); }
}

/* ===================== RENDER ===================== */
function rr(x,y,w,h,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }

function drawBgGrid(){
  ctx.fillStyle='#06201d'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(47,197,111,0.06)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

/* ----- THEMED 8BIT BACKGROUNDS (pre-rendered pixel art + light live layer) ----- */
function drawLevelBg(){
  const img=bgImgs[lvl.theme];
  if(img && img.complete && img.naturalWidth){ ctx.drawImage(img,0,0,W,H); }
  else { ctx.fillStyle = lvl.theme==='factory' ? '#19130a' : lvl.theme==='hr' ? '#13201e' : '#08161c'; ctx.fillRect(0,0,W,H); }
  if(lvl.theme==='it') fxIT();
  else if(lvl.theme==='factory') fxFactory();
  else fxHR();
}
// IT: matrix binary rain drifting down
function fxIT(){
  ctx.fillStyle='rgba(61,255,160,0.10)'; ctx.font='13px PixelArcade, monospace';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  for(let i=0;i<34;i++){ const x=(i*47)%W, y=((tick*1.3 + i*61)%600); ctx.fillText((i*7%2)?'1':'0', x, y); }
}
// Factory: finished ŠkoPilot cars riding the assembly line (moving left)
function fxFactory(){
  for(let i=0;i<3;i++){
    let x=((i*300 - tick*0.9)%(W+140)); if(x<-140) x+=W+140;
    const img=carImgs[i%carImgs.length];
    if(img.complete && img.naturalWidth){
      const cw=64, ch=cw*img.naturalHeight/img.naturalWidth;
      ctx.drawImage(img, x, 388-ch, cw, ch);
    }
  }
}
// HR: papers floating across the office
function fxHR(){
  for(let i=0;i<6;i++){
    const x=((i*150 + tick*0.6)%(W+30))-30, y=120+((i*53)%120)+Math.sin((tick+i*40)/40)*6;
    ctx.fillStyle='rgba(238,246,244,0.20)'; ctx.fillRect(x,y,14,18);
    ctx.fillStyle='rgba(120,150,160,0.30)';
    ctx.fillRect(x+2,y+4,10,1); ctx.fillRect(x+2,y+8,10,1); ctx.fillRect(x+2,y+12,7,1);
  }
}

function drawPlatform(p){
  const ground = p.y>=560;
  if(ground){
    ctx.fillStyle=lvl.wall; ctx.fillRect(p.x,p.y,p.w,p.h);
    if(lvl.theme==='factory'){
      ctx.fillStyle='#2a2206';
      for(let x=-24;x<W;x+=24){ const off=(tick*1.2)%24;
        ctx.beginPath(); ctx.moveTo(p.x+x+off,p.y); ctx.lineTo(p.x+x+off+12,p.y);
        ctx.lineTo(p.x+x+off,p.y+p.h); ctx.closePath(); ctx.fill(); }
    } else if(lvl.theme==='it'){
      ctx.strokeStyle=lvl.accent; ctx.globalAlpha=.25; ctx.lineWidth=1;
      for(let x=10;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(p.x+x,p.y+6); ctx.lineTo(p.x+x,p.y+p.h); ctx.stroke(); }
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle='#0f1a18'; ctx.fillRect(p.x,p.y+p.h-8,p.w,8); // baseboard
    }
    ctx.fillStyle=lvl.accent; ctx.fillRect(p.x,p.y,p.w,3);
  } else {
    ctx.fillStyle=lvl.wall; rr(p.x,p.y,p.w,p.h,5); ctx.fill();
    ctx.fillStyle=lvl.accent; ctx.fillRect(p.x,p.y,p.w,3);
    if(lvl.theme==='factory'){ ctx.fillStyle='#caa64a';
      for(let bx=p.x+7;bx<p.x+p.w-4;bx+=22){ ctx.fillRect(bx,p.y+6,3,3); ctx.fillRect(bx,p.y+p.h-9,3,3); } }
    else if(lvl.theme==='it'){ ctx.fillStyle=lvl.accent; ctx.globalAlpha=.5;
      for(let bx=p.x+8;bx<p.x+p.w-4;bx+=16) ctx.fillRect(bx,p.y+p.h-5,6,2); ctx.globalAlpha=1; }
  }
}

function drawTool(t){
  if(t.got) return;
  const img=itemImgs.floppy, bob=Math.sin((tick+t.x)/18)*3;
  if(img.complete && img.naturalWidth){
    const dw=28, dh=dw*img.naturalHeight/img.naturalWidth;
    const dx=t.x+t.w/2-dw/2, dy=t.y+t.h/2-dh/2+bob;
    ctx.save(); ctx.shadowColor='#ffcf2e'; ctx.shadowBlur=8;
    ctx.drawImage(img,dx,dy,dw,dh); ctx.restore();
    // label printed on the floppy's cream sticker (~0.64 of height)
    ctx.fillStyle='#5a4a00'; ctx.font='7px PixelArcade, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.label, dx+dw/2, dy+dh*0.64);
  } else {
    ctx.save(); ctx.translate(t.x+11,t.y+11+bob);
    ctx.fillStyle='#ffcf2e'; rr(-11,-11,22,22,5); ctx.fill();
    ctx.fillStyle='#1a1300'; ctx.font='bold 9px PixelArcade, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.label,0,1);
    ctx.restore();
  }
}

function drawPowerup(pu){
  if(pu.got) return;
  const img = pu.type==='coffee' ? itemImgs.coffee : itemImgs.shield;
  const bob=Math.sin((tick+pu.x)/16)*3;
  if(img.complete && img.naturalWidth){
    const dw=pu.w+6, dh=dw*img.naturalHeight/img.naturalWidth;
    const dx=pu.x+pu.w/2-dw/2, dy=pu.y+pu.h/2-dh/2+bob;
    ctx.save(); ctx.shadowColor=pu.type==='coffee'?'#ffae42':'#9ec4ff'; ctx.shadowBlur=12;
    ctx.drawImage(img,dx,dy,dw,dh); ctx.restore();
  } else {
    const y=pu.y+bob;
    ctx.save(); ctx.shadowColor=pu.type==='coffee'?'#ffae42':'#7dffb4'; ctx.shadowBlur=12;
    ctx.fillStyle=pu.type==='coffee'?'#7a3b10':'#0e3a52'; rr(pu.x,y,pu.w,pu.h,6); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='12px PixelArcade, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(pu.type==='coffee'?'C':'F',pu.x+pu.w/2,y+pu.h/2+1);
    ctx.restore();
  }
}

function drawChassis(){
  const active=toolsLeft()===0, x=chassis.x,y=chassis.y;
  ctx.save();
  if(active){ ctx.shadowColor=lvl.accent; ctx.shadowBlur=18; }
  ctx.strokeStyle=active?lvl.accent:'#3c5a52'; ctx.lineWidth=2; ctx.setLineDash(active?[]:[5,4]);
  rr(x+6,y+18,38,34,6); ctx.stroke();          // tělo
  ctx.beginPath(); ctx.arc(x+25,y+12,11,0,Math.PI*2); ctx.stroke();  // hlava
  ctx.setLineDash([]); ctx.restore();
  ctx.fillStyle=active?lvl.accent:'#3c5a52'; ctx.font='8px PixelArcade, monospace'; ctx.textAlign='center';
  ctx.fillText(active?'BUILD!':'AGENT', x+25, y+64);
}

function drawPlayer(){
  if(invuln>0 && Math.floor(tick/4)%2===0) return; // blik
  const p=player, cx=p.x+p.w/2;
  // jet při stoupání (za sprite)
  if(p.vy<-1){ ctx.fillStyle='#ffcf2e'; ctx.beginPath();
    ctx.moveTo(cx-5,p.y+p.h-3); ctx.lineTo(cx+5,p.y+p.h-3); ctx.lineTo(cx,p.y+p.h+6+Math.random()*4); ctx.closePath(); ctx.fill(); }
  // ŠkoPilot 8bit sprite — vyplní hráčův box, zrcadlí podle směru
  const dw=p.w+10, dh=p.h+8, dx=cx-dw/2, dy=p.y+p.h-dh;
  if(playerImg.complete && playerImg.naturalWidth){
    ctx.save();
    if(firewall>0){ ctx.shadowColor='#9ec4ff'; ctx.shadowBlur=14; }
    if(p.face<0){ ctx.translate(cx,0); ctx.scale(-1,1); ctx.translate(-cx,0); }
    ctx.drawImage(playerImg,dx,dy,dw,dh);
    ctx.restore();
  } else {
    ctx.fillStyle = firewall>0 ? '#2a6cff' : '#1c8a52';
    rr(p.x+5,p.y+15,p.w-10,p.h-19,5); ctx.fill();
    ctx.fillStyle='#eef6f4'; ctx.beginPath(); ctx.arc(cx,p.y+11,11,0,7); ctx.fill();
  }
  // firewall štít
  if(firewall>0){ ctx.strokeStyle='#9ec4ff'; ctx.lineWidth=2; rr(p.x-2,p.y-2,p.w+4,p.h+4,7); ctx.stroke(); }
}

function drawEnemy(e){
  if(!e.alive)return;
  const img=enemySprite(e.kind), cx=e.x+e.w/2;
  if(img && img.complete && img.naturalWidth){
    const dw=e.w+6, dh=dw*img.height/img.width, dx=cx-dw/2, dy=e.y+e.h-dh+2;
    ctx.save();
    if(e.vx<0){ ctx.translate(cx,0); ctx.scale(-1,1); ctx.translate(-cx,0); }
    ctx.drawImage(img,dx,dy,dw,dh);
    ctx.restore();
  } else {                                     // fallback before sprites load
    ctx.fillStyle = (e.kind==='email'||e.kind==='paper') ? '#e7eef6'
                  : (e.kind==='arm'||e.kind==='delay') ? '#8a8f96' : '#ff5d5d';
    rr(e.x,e.y,e.w,e.h,5); ctx.fill();
  }
}

function drawShots(){ for(const s of shots){ ctx.save(); ctx.shadowColor='#b8f5da';ctx.shadowBlur=8;
  ctx.fillStyle='#eaffff'; rr(s.x-5,s.y-2,10,5,2); ctx.fill(); ctx.restore(); } }

function drawParticles(){ for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
  ctx.fillRect(p.x|0,p.y|0,3,3);} ctx.globalAlpha=1; }

function drawHUD(){
  ctx.fillStyle='rgba(2,16,11,.7)'; ctx.fillRect(0,0,W,30);
  ctx.fillStyle='#eef6f4'; ctx.font='11px PixelArcade, monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'),10,15);
  ctx.fillStyle=lvl.accent; ctx.textAlign='center'; ctx.fillText(lvl.name,W/2,15);
  // tooly
  ctx.textAlign='right'; ctx.fillStyle='#f5c518';
  ctx.fillText('TOOLS '+(tools.length-toolsLeft())+'/'+tools.length, W-10,15);
  // životy
  ctx.textAlign='left'; ctx.fillStyle='#ff6a6a';
  for(let i=0;i<lives;i++) ctx.fillText('♥', 200+i*16, 15);
  // server timeout bar
  const bw=200, bx=W/2-bw/2, by=24;
  ctx.fillStyle='#0d2c1d'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=timeLeft<10?'#ff5d5d':lvl.accent; ctx.fillRect(bx,by,bw*(timeLeft/lvl.time),4);
  // powerup ikonky (8bit sprity)
  let px=200+lives*16+14;
  if(speedBoost>0){
    if(itemImgs.coffee.complete && itemImgs.coffee.naturalWidth) ctx.drawImage(itemImgs.coffee,px,3,15,15);
    else { ctx.fillStyle='#ffae42'; ctx.fillText('C',px,15); }
    px+=20;
  }
  if(firewall>0){
    if(itemImgs.shield.complete && itemImgs.shield.naturalWidth) ctx.drawImage(itemImgs.shield,px,4,14,14);
    else { ctx.fillStyle='#9ec4ff'; ctx.fillText('F',px,15); }
  }
}

function center(t,y,col,size){ ctx.fillStyle=col; ctx.font=size+'px PixelArcade, monospace'; ctx.textAlign='center'; ctx.fillText(t,W/2,y); }

function drawTitle(){
  drawBgGrid();
  if(playerImg.complete && playerImg.naturalWidth){ const bw=90,bh=bw*playerImg.height/playerImg.width; ctx.drawImage(playerImg, W/2-bw/2, 64, bw, bh); }
  else if(headImg.complete) ctx.drawImage(headImg, W/2-40, 70, 80, 80);
  center('ŠKOPILOT PRO', 210, '#39ff8c', 30);
  center('AGENT BUILDER', 242, '#7dffb4', 13);
  ctx.fillStyle='#bcd'; ctx.font='10px PixelArcade, monospace'; ctx.textAlign='center';
  const story=['The Mlada Boleslav cloud crashed!','SkoPilot lost his AI modules.','Grab the TOOLS, beat the BUGS,','and build an AI Agent at each exit.'];
  story.forEach((s,i)=>ctx.fillText(s, W/2, 300+i*26));
  ctx.fillStyle='#8aa'; ctx.fillText('JOY = MOVE/JUMP  ·  X = SHOOT BUG  ·  SPACE = JUMP', W/2, 410);
  ctx.fillStyle='#3c5a52'; ctx.fillText('JOY UP / BKSP = HALL OF FAME', W/2, 434);
  if(Math.floor(tick/30)%2===0) center('PUSH START', 470, '#ffff44', 18);
  // mini hi-score
  ctx.fillStyle='#3c5a52'; ctx.font='9px PixelArcade, monospace';
  ctx.fillText('BEST '+String(best).padStart(6,'0'), W/2, 520);
}

function drawClear(){
  drawScene();
  ctx.fillStyle='rgba(2,16,11,.7)'; ctx.fillRect(0,0,W,H);
  drawParticles();
  center('AGENT BUILT!', H/2-30, lvl.accent, 26);
  center(lvl.agent, H/2+10, '#fff', 16);
}

function drawGameOver(){
  drawBgGrid();
  if(victoryFlag){ center('ALL AGENTS RESTORED!', 220, '#39ff8c', 24); center('SKOPILOT SAVED THE CLOUD', 256,'#7dffb4',12); }
  else center('SERVER CRASH', 220, '#ff5d5d', 30);
  center('GAME OVER', 262, '#fff', 16);
  center('SCORE  '+String(score).padStart(6,'0'), 330, '#f5c518', 16);
  if(Math.floor(tick/30)%2===0) center('PUSH START', 410, '#ffff44', 16);
}

function drawEnter(){
  drawBgGrid();
  center('NEW HIGH SCORE!', 150, '#f5c518', 22);
  center('SCORE  '+String(score).padStart(6,'0'), 188, '#fff', 13);
  center('ENTER YOUR NAME', 250, '#7dffb4', 12);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<NAME_LEN;i++){
    const x=W/2-((NAME_LEN-1)*60)/2+i*60;
    ctx.fillStyle = i===entryPos ? '#39ff8c' : '#0d4631';
    rr(x-22,310,44,54,6); ctx.fill();
    if(entryName[i]!==' '){ ctx.fillStyle='#fff'; ctx.font='30px PixelArcade, monospace'; ctx.fillText(entryName[i],x,338); }
    if(i===entryPos && Math.floor(tick/20)%2===0){ ctx.fillStyle='#ffff44'; ctx.font='12px PixelArcade, monospace';
      ctx.fillText('▲',x,296); ctx.fillText('▼',x,378); }
  }
  ctx.fillStyle='#8aa'; ctx.font='9px PixelArcade, monospace';
  ctx.fillText('JOY UP/DOWN = CHAR · LEFT/RIGHT = MOVE · START = OK', W/2, 424);
  ctx.fillText('OR TYPE A-Z 1-9 - / · BACKSPACE = ERASE', W/2, 448);
  if(entryConfirm) drawSaveConfirm();
}

function drawSaveConfirm(){
  ctx.fillStyle='rgba(2,16,11,.94)';
  ctx.fillRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
  ctx.strokeStyle='#f5c518'; ctx.lineWidth=3;
  ctx.strokeRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='12px PixelArcade, monospace';
  ctx.fillText('SAVE "'+(entryName.join('').trim()||'AAA')+'" ?', W/2, H/2-48);
  ctx.fillStyle='#f5c518'; ctx.font='13px PixelArcade, monospace';
  ctx.fillText('ARE YOU SURE?', W/2, H/2-22);
  [['NO',-85,!entryYes],['YES',85,entryYes]].forEach(([t,dx,on])=>{
    const bx=W/2+dx, by=H/2+34;
    ctx.fillStyle = on ? '#1f9c5e' : '#0d3a33';
    ctx.fillRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH);
    if(on){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH); }
    ctx.fillStyle=on?'#fff':'#8aa'; ctx.font='13px PixelArcade, monospace';
    ctx.fillText(t, bx, by);
  });
  ctx.textBaseline='alphabetic';
}

const SC={ rowY0:190, rowH:48, rowW:560, cfW:460, cfH:150, btnW:120, btnH:40 };
function actionRow(idx, label, danger){
  const cy=SC.rowY0+idx*SC.rowH, sel=idx===scoreSel;
  if(sel){
    ctx.fillStyle = danger ? '#3a0f12' : '#0d3a33';
    ctx.fillRect(W/2-SC.rowW/2, cy-SC.rowH/2+4, SC.rowW, SC.rowH-8);
  }
  ctx.fillStyle = sel ? (danger?'#ff5d5d':'#39ff8c') : (danger?'#7e4a4a':'#7e9a90');
  ctx.font='12px PixelArcade, monospace';
  ctx.fillText(label, W/2, cy);
}

function drawScores(){
  drawBgGrid();
  center(manage?'MANAGE RECORDS':'HALL OF FAME', 110, manage?'#f5c518':'#39ff8c', 24);
  ctx.textBaseline='middle';
  scores.forEach((e,i)=>{
    const cy=SC.rowY0+i*SC.rowH;
    if(manage && i===scoreSel){
      ctx.fillStyle='#0d3a33'; ctx.fillRect(W/2-SC.rowW/2, cy-SC.rowH/2+4, SC.rowW, SC.rowH-8);
      ctx.fillStyle='#ff5d5d'; ctx.font='14px PixelArcade, monospace';
      ctx.textAlign='right'; ctx.fillText('✖', W/2+SC.rowW/2-16, cy);
    }
    ctx.textAlign='center'; ctx.fillStyle=i===0?'#f5c518':'#cdeede';
    ctx.font='16px PixelArcade, monospace';
    ctx.fillText((i+1)+'. '+e.n.padEnd(NAME_LEN)+' '+String(e.s).padStart(6,'0'), W/2, cy);
  });
  ctx.textAlign='center';
  if(manage){
    actionRow(scores.length, 'DELETE ALL', true);
    actionRow(scores.length+1, 'BACK', false);
  } else {
    actionRow(scores.length, 'MANAGE RECORDS', false);
  }
  if(!scores.length){
    ctx.fillStyle='#3c5a52'; ctx.font='12px PixelArcade, monospace';
    ctx.fillText('NO RECORDS', W/2, SC.rowY0+(manage?3:2)*SC.rowH);
  }
  ctx.textBaseline='alphabetic';
  if(manage){
    ctx.fillStyle='#3c5a52'; ctx.font='9px PixelArcade, monospace';
    ctx.fillText('JOY ↑↓ / MOUSE = SELECT · X / START = OK', W/2, 540);
  } else {
    ctx.fillStyle='#3c5a52'; ctx.font='9px PixelArcade, monospace';
    ctx.fillText('X / CLICK = MANAGE RECORDS', W/2, 488);
    if(Math.floor(tick/30)%2===0) center('PUSH START', 530, '#ffff44', 14);
  }
  if(delConfirm) drawDelConfirm();
}

function drawDelConfirm(){
  ctx.fillStyle='rgba(2,16,11,.92)';
  ctx.fillRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
  ctx.strokeStyle='#ff5d5d'; ctx.lineWidth=3;
  ctx.strokeRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='13px PixelArcade, monospace';
  const label = scoreSel===scores.length
    ? 'DELETE ALL RECORDS?'
    : 'DELETE '+(scores[scoreSel]?scores[scoreSel].n.trim():'')+' ?';
  ctx.fillText(label, W/2, H/2-36);
  [['NO',-85,!delYes],['YES',85,delYes]].forEach(([t,dx,on])=>{
    const bx=W/2+dx, by=H/2+30;
    ctx.fillStyle = on ? (t==='YES'?'#7a1f1f':'#1f9c5e') : '#0d3a33';
    ctx.fillRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH);
    if(on){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH); }
    ctx.fillStyle=on?'#fff':'#8aa'; ctx.font='13px PixelArcade, monospace';
    ctx.fillText(t, bx, by);
  });
  ctx.textBaseline='alphabetic';
}

/* ----- myš v síni slávy (hover + klik = smazání) ----- */
function canvasPos(e){
  const r=canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
function scoresRowAt(x,y){
  if(Math.abs(x-W/2)>SC.rowW/2) return -1;
  for(let i=0;i<scRows();i++){
    const cy=SC.rowY0+i*SC.rowH;
    if(y>cy-SC.rowH/2 && y<cy+SC.rowH/2){
      if(!manage && i!==scores.length) return -1;   // hlavní pohled: klikací je jen MANAGE
      return i;
    }
  }
  return -1;
}
function confirmHit(x,y){
  const by=H/2+30;
  if(Math.abs(y-by)>SC.btnH/2) return null;
  if(Math.abs(x-(W/2-85))<SC.btnW/2) return 'no';
  if(Math.abs(x-(W/2+85))<SC.btnW/2) return 'yes';
  return null;
}
canvas.addEventListener('mousemove',e=>{
  if(state!=='scores'||delConfirm) return;
  bumpScores();
  const p=canvasPos(e);
  const row=scoresRowAt(p.x,p.y);
  if(manage){ if(row>=0) scoreSel=row; }
  else scoreSel=row;
});
canvas.addEventListener('click',e=>{
  if(state!=='scores') return;
  bumpScores();
  const p=canvasPos(e);
  if(delConfirm){
    const hit=confirmHit(p.x,p.y);
    if(hit){ if(hit==='yes') doDelete(); delConfirm=false; }
    return;
  }
  const row=scoresRowAt(p.x,p.y);
  if(!manage){
    if(row===scores.length) enterManage();
    return;
  }
  if(row>=0){ scoreSel=row; activateManage(); }
});

function drawScene(){
  drawLevelBg();
  for(const p of lvl.platforms) drawPlatform(p);
  drawChassis();
  for(const t of tools) drawTool(t);
  for(const pu of powerups) drawPowerup(pu);
  for(const e of enemies) drawEnemy(e);
  drawShots();
  drawPlayer();
  drawParticles();
  drawHUD();
  if(toolsLeft()===0){ ctx.fillStyle=lvl.accent; ctx.font='10px PixelArcade, monospace'; ctx.textAlign='center';
    if(Math.floor(tick/20)%2===0) ctx.fillText('→ BRING TO CHASSIS!', chassis.x+25, chassis.y-10); }
}

/* ===================== LOOP ===================== */
let acc=0,lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs)lastTs=ts; acc+=Math.min(ts-lastTs,100); lastTs=ts;
  while(acc>=STEP){ acc-=STEP; update(); }
  if(state==='scores' && ts-scoresActivityTs>SCORES_TIMEOUT) initTitle();
  if(state==='title') drawTitle();
  else if(state==='play') drawScene();
  else if(state==='clear') drawClear();
  else if(state==='gameover') drawGameOver();
  else if(state==='enter') drawEnter();
  else if(state==='scores') drawScores();
  const help = document.getElementById('controlsHelp');
  if (help && !help.dataset.missing) help.classList.toggle('show', state==='title');
  document.body.classList.toggle('allow-cursor', state==='scores');
}
loadLevel(0);        // ať lvl existuje pro případné kreslení
initTitle();
requestAnimationFrame(loop);
</script>
