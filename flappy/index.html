<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy ŠkoPilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body{height:100%;}
    body {
      background:#03100a;
      display: flex;
      align-items: center;
      justify-content: center;
      height:100vh;
      overflow:hidden;
      font-family: 'Trebuchet MS', system-ui, sans-serif;
      user-select:none;
    }
    /* CRT scanlines */
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);
    }
    #stage{ transform-origin:center center; position:relative; }
    #hud { display:flex; gap:2rem; margin-bottom:.6rem; font-size:18px; color:#5a8a72; letter-spacing:1px; }
    #hud span { font-weight:700; color:#eef6f4; }
    #canvas { border-radius:12px; border:2px solid #1c4a35; display:block; cursor:pointer;
              box-shadow:0 0 30px rgba(47,197,111,.25); }
    #hint { margin-top:.5rem; font-size:14px; color:#3f6b55; text-align:center; }
    #menuBtn{
      position:fixed; top:14px; left:14px; z-index:60;
      background:#0c2418; color:#b8f5da; border:1px solid #235c41;
      border-radius:8px; padding:8px 14px; font-size:15px; letter-spacing:1px;
      cursor:pointer; font-family:inherit;
    }
    #menuBtn:hover{ background:#11331f; }
  </style>
</head>
<body>
  <button id="menuBtn" onclick="location.href='../index.html'">◀ MENU</button>
  <div id="stage">
    <div id="hud">SKÓRE: <span id="score">0</span>&nbsp;&nbsp; NEJLEPŠÍ: <span id="best">0</span>&nbsp;&nbsp; 🪙 <span id="coins">0</span></div>
    <canvas id="canvas" width="580" height="380"></canvas>
    <div id="hint">Mezerník nebo klik = skok &nbsp;·&nbsp; ESC = menu</div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const coinsEl = document.getElementById('coins');
    const stage = document.getElementById('stage');

    // === Škálování na celou obrazovku (arcade) ===
    function fitStage(){
      const s = Math.min(window.innerWidth / stage.offsetWidth,
                         window.innerHeight / stage.offsetHeight);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('load', fitStage);
    fitStage();

    const W = canvas.width, H = canvas.height;
    const GRAVITY = 0.45;
    const JUMP = -6;
    const PIPE_W = 52;
    const PIPE_SPEED = 2.6;
    const PIPE_INTERVAL = 1600;
    const BALL_X = 110;

    const HIT_RX = 22;
    const HIT_RY = 19;
    const HIT_OY = 0;
    const AV_W = HIT_RX * 2 + 2;
    const AV_H = HIT_RY * 2 + 2;

    let gapQueue = [];
    function buildGapQueue() {
      const big   = () => Math.floor(Math.random() * 20) + 180;
      const mid   = () => Math.floor(Math.random() * 20) + 125;
      const small = () => Math.floor(Math.random() * 15) + 90;

      let arr;
      if (score >= 20) {
        arr = [mid(), small(), small(), small(), small()];
      } else if (score >= 10) {
        arr = [mid(), mid(), mid(), small(), small()];
      } else {
        arr = [big(), mid(), mid(), mid(), small()];
      }

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      gapQueue = arr;
    }
    function nextGapValue() {
      if (gapQueue.length === 0) buildGapQueue();
      return gapQueue.shift();
    }

    const avatarImg = new Image();
    let avatarCanvas = null;

    avatarImg.onload = () => {
      const oc = document.createElement('canvas');
      oc.width = avatarImg.width;
      oc.height = avatarImg.height;
      const oc2 = oc.getContext('2d');
      oc2.drawImage(avatarImg, 0, 0);
      try {
        const id = oc2.getImageData(0, 0, oc.width, oc.height);
        const d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          const br = d[i] + d[i+1] + d[i+2];
          if (br < 60) d[i+3] = 0;
          else if (br < 120) d[i+3] = Math.round((br - 60) / 60 * 255);
        }
        oc2.putImageData(id, 0, 0);
      } catch(e){ /* cross-origin u file:// někdy blokuje – necháme tak */ }
      avatarCanvas = oc;
    };
    // Hlava maskota ŠkoPilot
    avatarImg.src = '../invaders/skopilotHead.png';

    let ball, pipes, coins, pipeCount, score, best, state, lastPipe;
    best = +localStorage.getItem('sko_flappy_best') || 0;
    bestEl.textContent = best;

    function init() {
      ball = { y: H / 2, vy: 0 };
      pipes = [];
      score = 0;
      coins = 0;
      pipeCount = 0;
      state = 'idle';
      lastPipe = 0;

      gapQueue = [];
      scoreEl.textContent = 0;
      coinsEl.textContent = 0;
    }

    function spawnPipe() {
      const gap = nextGapValue();
      const minH = 50, maxH = H - 80 - 50 - gap;
      const topH = Math.floor(Math.random() * (maxH - minH) + minH);
      pipeCount++;
      const hasCoin = (pipeCount % 5 === 0);
      const coinY = topH + gap / 2;
      pipes.push({ x: W + 10, topH, gap, scored: false, hasCoin, coinY, coinX: W + 10 + PIPE_W / 2, coinCollected: false });
    }

    function jump() {
      if (state === 'dead') { init(); return; }
      if (state === 'idle') state = 'playing';
      ball.vy = JUMP;
    }

    canvas.addEventListener('click', jump);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); jump(); }
      if (e.key === 'Escape') { location.href = '../index.html'; }
    });

    function drawSky() {
      ctx.fillStyle = '#07140d';
      ctx.fillRect(0, 0, W, H - 40);
      ctx.fillStyle = '#0d2c1d';
      ctx.fillRect(0, H - 40, W, 40);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
      ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r);
      ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h);
      ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath(); ctx.fill();
    }

    function drawPipe(p) {
      ctx.fillStyle = '#2fc56f';
      roundRect(p.x, 0, PIPE_W, p.topH, 5);
      roundRect(p.x, p.topH + p.gap, PIPE_W, H - p.topH - p.gap - 40, 5);
      ctx.fillStyle = '#0d4631';
      ctx.fillRect(p.x - 5, p.topH - 18, PIPE_W + 10, 18);
      ctx.fillRect(p.x - 5, p.topH + p.gap, PIPE_W + 10, 18);
    }

    function drawCoin(p) {
      if (!p.hasCoin || p.coinCollected) return;
      const cx = p.coinX, cy = p.coinY, r = 10;
      ctx.save();
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#f5c518';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - 3, cy - 3, r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,200,0.55)';
      ctx.fill();
      ctx.fillStyle = '#c8960a';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, cy);
      ctx.restore();
    }

    function drawAvatar() {
      const tilt = Math.max(-0.4, Math.min(0.4, ball.vy * 0.05));
      ctx.save();
      ctx.translate(BALL_X, ball.y + HIT_OY);
      ctx.rotate(tilt);
      if (avatarCanvas) {
        ctx.drawImage(avatarCanvas, -AV_W/2, -AV_H/2, AV_W, AV_H);
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, HIT_RX, HIT_RY, 0, 0, Math.PI*2);
        ctx.fillStyle = '#2fc56f'; ctx.fill();
      }
      ctx.restore();
    }

    function collidesEllipse(p) {
      const cx = BALL_X, cy = ball.y + HIT_OY;
      const rx = HIT_RX, ry = HIT_RY;
      function hits(bx, by, bw, bh) {
        const nx = Math.max(bx, Math.min(cx, bx+bw));
        const ny = Math.max(by, Math.min(cy, by+bh));
        const dx = (cx-nx)/rx, dy = (cy-ny)/ry;
        return dx*dx + dy*dy < 1;
      }
      if (hits(p.x-5, 0, PIPE_W+10, p.topH)) return true;
      if (hits(p.x-5, p.topH-18, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap+18, PIPE_W+10, H)) return true;
      return false;
    }

    function drawOverlay() {
      ctx.fillStyle = 'rgba(3,16,10,0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#eef6f4';
      ctx.font = '900 26px Trebuchet MS, sans-serif';
      ctx.textAlign = 'center';
      if (state === 'idle') {
        ctx.fillStyle = '#2fc56f';
        ctx.fillText('Flappy ŠkoPilot', W/2, H/2 - 24);
        ctx.font = '400 15px sans-serif';
        ctx.fillStyle = '#cdeede';
        ctx.fillText('Klikni nebo stiskni Mezerník pro start', W/2, H/2 + 10);
      } else {
        ctx.fillStyle = '#ff6a6a';
        ctx.fillText('Konec hry!', W/2, H/2 - 36);
        ctx.font = '400 15px sans-serif';
        ctx.fillStyle = '#cdeede';
        ctx.fillText('Skóre: ' + score + '   Nejlepší: ' + best, W/2, H/2);
        ctx.fillText('Klikni nebo Mezerník pro restart', W/2, H/2 + 28);
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      drawSky();
      if (state === 'playing') {
        ball.vy += GRAVITY;
        ball.y += ball.vy;
        if (now - lastPipe > PIPE_INTERVAL) { spawnPipe(); lastPipe = now; }
        for (let p of pipes) {
          p.x -= PIPE_SPEED;
          p.coinX -= PIPE_SPEED;
          if (!p.scored && p.x + PIPE_W < BALL_X) {
            p.scored = true; score++;
            scoreEl.textContent = score;
            if (score > best) {
              best = score; bestEl.textContent = best;
              localStorage.setItem('sko_flappy_best', best);
            }
          }
          if (p.hasCoin && !p.coinCollected) {
            const dx = BALL_X - p.coinX, dy = (ball.y + HIT_OY) - p.coinY;
            if (Math.sqrt(dx*dx + dy*dy) < HIT_RX + 10) {
              p.coinCollected = true;
              coins++;
              coinsEl.textContent = coins;
            }
          }
          if (collidesEllipse(p)) state = 'dead';
        }
        pipes = pipes.filter(p => p.x + PIPE_W > -10);
        if (ball.y + HIT_RY + HIT_OY > H - 40 || ball.y - HIT_RY + HIT_OY < 0) state = 'dead';
      }
      for (let p of pipes) drawPipe(p);
      for (let p of pipes) drawCoin(p);
      drawAvatar();
      if (state !== 'playing') drawOverlay();
    }

    init();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
