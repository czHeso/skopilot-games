<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŠkoPilot Games — Arcade</title>
<style>
  @font-face{
    font-family:'PixelArcade';
    src:url('assets/fonts/PressStart2P.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --g1:#2fc56f; --g2:#62e29a; --g3:#0d4631;
    --mint:#b8f5da; --white:#eef6f4; --gold:#f5c518; --bg:#02080c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#02080c; color:var(--white);
    font-family:'PixelArcade','Courier New',monospace;
    overflow:hidden; height:100vh; user-select:none; cursor:default;
  }
  #stars{position:fixed;inset:0;z-index:0;}
  #screen{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(8px,2.2vh,28px) 12px;text-align:center;
  }
  #screen::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    box-shadow:inset 0 0 160px 50px rgba(0,0,0,.9);
    background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.3) 100%);
  }

  /* HLAVIČKA */
  .head{display:flex;align-items:center;gap:clamp(10px,2vw,26px);}
  .avatar{
    height:clamp(54px,10vh,108px);width:auto;
    filter:drop-shadow(0 0 14px rgba(47,197,111,.55));
    animation:bob 2.4s steps(2,end) infinite;
  }
  @keyframes bob{50%{transform:translateY(-6px);}}
  .titles{text-align:left;}
  .title{
    font-size:clamp(15px,3.4vw,34px);line-height:1.25;color:var(--g2);
    text-shadow:3px 3px 0 var(--g3),0 0 12px rgba(47,197,111,.55);letter-spacing:2px;
  }
  .title b{color:var(--white);}
  .subtitle{margin-top:6px;font-size:clamp(7px,1.3vw,11px);color:var(--gold);letter-spacing:2px;}

  /* MŘÍŽKA HER */
  main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;
        gap:clamp(12px,2.2vw,30px);padding:0 10px;}
  .card{
    width:clamp(150px,19vw,230px);
    display:flex;flex-direction:column;align-items:center;
    cursor:pointer;transition:transform .12s;
  }
  .frame{
    width:100%;aspect-ratio:4/3;position:relative;
    border-radius:10px;overflow:hidden;
    border:3px solid #16382a;
    box-shadow:inset 0 0 0 2px #02080c, 0 6px 14px rgba(0,0,0,.5);
    background:#07140d;
  }
  .frame svg{display:block;width:100%;height:100%;}
  .frame::after{ /* scanlines na náhledu */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);
  }
  .cap{margin-top:10px;font-size:clamp(8px,1.2vw,13px);color:#6f9d85;letter-spacing:1px;line-height:1.5;}
  .genre{margin-top:6px;font-size:clamp(6px,1vw,9px);color:#3f6b55;letter-spacing:1px;}
  .hi{margin-top:5px;font-size:clamp(6px,1vw,9px);color:#2c5a40;letter-spacing:1px;}

  .card.sel{transform:translateY(-6px) scale(1.05);}
  .card.sel .frame{
    border-color:var(--g1);
    box-shadow:inset 0 0 0 2px #02080c,0 0 22px rgba(47,197,111,.65),0 6px 14px rgba(0,0,0,.5);
  }
  .card.sel .cap{color:var(--g2);text-shadow:0 0 8px rgba(47,197,111,.6);}
  .card.sel .hi{color:var(--gold);}
  .card.sel .frame::before{
    content:"\25B6 HRAJ";position:absolute;z-index:3;left:50%;bottom:8px;transform:translateX(-50%);
    background:var(--g1);color:#02080c;font-size:clamp(7px,1vw,10px);
    padding:4px 9px;border-radius:4px;letter-spacing:1px;
    animation:blink .5s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .foot{display:flex;flex-direction:column;gap:clamp(5px,1.2vh,12px);align-items:center;}
  .coin{font-size:clamp(9px,1.7vw,16px);color:#fff;letter-spacing:2px;animation:blink 1.1s steps(1) infinite;}
  .hint{font-size:clamp(6px,1.1vw,10px);color:#2c5a40;letter-spacing:1px;line-height:1.8;}
  .credit{font-size:clamp(6px,1.1vw,10px);color:#244;letter-spacing:1px;}
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="screen">
    <div class="head">
      <img class="avatar" src="assets/skopilot.png"
           onerror="this.onerror=null;this.src='invaders/skopilotHead.png'" alt="ŠkoPilot">
      <div class="titles">
        <div class="title">ŠKO<b>PILOT</b><br>GAMES</div>
        <div class="subtitle">ŠKOPILOT EDITION</div>
      </div>
    </div>

    <main><div class="grid" id="grid"></div></main>

    <div class="foot">
      <div class="coin">PUSH START</div>
      <div class="hint">JOYSTICK / &larr;&rarr; VYBER &nbsp;&middot;&nbsp; START / ENTER HRAJ &nbsp;&middot;&nbsp; ESC = MENU</div>
      <div class="credit">&copy; 2026 ŠKODA &middot; SKOPILOT ARCADE</div>
    </div>
  </div>

<script>
  const HEAD = 'invaders/skopilotHead.png';

  // Náhledové obrázky her (inline SVG, barvy maskota)
  const ART = {
    flappy:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#07140d"/>
      <rect y="108" width="160" height="12" fill="#0d2c1d"/>
      <g fill="#2fc56f">
        <rect x="98" y="0" width="28" height="40"/><rect x="98" y="80" width="28" height="28"/>
      </g>
      <g fill="#0d4631">
        <rect x="94" y="36" width="36" height="9"/><rect x="94" y="80" width="36" height="9"/>
      </g>
      <circle cx="140" cy="62" r="9" fill="#f5c518"/>
      <text x="140" y="66" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8960a" text-anchor="middle">$</text>
      <image href="${HEAD}" x="40" y="46" width="34" height="34"/>
    </svg>`,

    invaders:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#07140d"/>
      <g fill="#1f5a3d">
        <rect x="12" y="14" width="2" height="2"/><rect x="44" y="8" width="2" height="2"/>
        <rect x="120" y="20" width="2" height="2"/><rect x="148" y="40" width="2" height="2"/>
        <rect x="70" y="30" width="2" height="2"/><rect x="100" y="52" width="2" height="2"/>
      </g>
      <g>
        ${[0,1,2].map(r=>[0,1,2,3].map(c=>{
          const x=30+c*30, y=18+r*20;
          const col=['#62e29a','#2fc56f','#27b063'][r];
          return `<g transform="translate(${x},${y})" fill="${col}">
            <rect x="-9" y="-6" width="18" height="12" rx="4"/>
            <rect x="-11" y="2" width="4" height="5"/><rect x="7" y="2" width="4" height="5"/>
            <circle cx="-4" cy="-1" r="2.2" fill="#06150d"/><circle cx="4" cy="-1" r="2.2" fill="#06150d"/>
          </g>`;
        }).join('')).join('')}
      </g>
      <g fill="#ffff88"><rect x="79" y="78" width="2" height="8"/></g>
      <polygon points="80,108 74,116 86,116" fill="#2fc56f"/>
      <image href="${HEAD}" x="66" y="88" width="28" height="28"/>
    </svg>`,

    snake:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#07140d"/>
      <g stroke="#0f2c1e" stroke-width="1">
        ${[20,40,60,80,100,120,140].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="120"/>`).join('')}
        ${[20,40,60,80,100].map(y=>`<line x1="0" y1="${y}" x2="160" y2="${y}"/>`).join('')}
      </g>
      <g fill="#2fc56f">
        <rect x="22" y="62" width="16" height="16" rx="5"/>
        <rect x="40" y="62" width="16" height="16" rx="5"/>
        <rect x="58" y="62" width="16" height="16" rx="5"/>
        <rect x="58" y="44" width="16" height="16" rx="5"/>
        <rect x="76" y="44" width="16" height="16" rx="5"/>
      </g>
      <image href="${HEAD}" x="94" y="42" width="20" height="20"/>
      <circle cx="128" cy="84" r="9" fill="#f5c518"/>
      <text x="128" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8960a" text-anchor="middle">$</text>
    </svg>`,

    breakout:`<svg viewBox="0 0 160 120" preserveAspectRatio="none">
      <rect width="160" height="120" fill="#07140d"/>
      <g>
        ${['#0d4631','#1c7a4a','#27b063','#2fc56f'].map((col,r)=>
          [0,1,2,3,4,5].map(c=>{
            const x=10+c*24, y=14+r*14;
            const gold=(r===1&&c===3)||(r===2&&c===1);
            return `<rect x="${x}" y="${y}" width="22" height="10" rx="2" fill="${gold?'#f5c518':col}"/>`;
          }).join('')).join('')}
      </g>
      <circle cx="96" cy="84" r="5" fill="#eef6f4"/>
      <rect x="60" y="100" width="46" height="9" rx="4" fill="#2fc56f"/>
      <image href="${HEAD}" x="74" y="96" width="18" height="18"/>
    </svg>`,
  };

  const GAMES = [
    { title:'FLAPPY SKOPILOT', genre:'LET A UHÝBEJ',   url:'flappy/index.html',   hi:'sko_flappy_best',   art:ART.flappy },
    { title:'SKOINVADERS',     genre:'STŘÍLEJ VETŘELCE',url:'invaders/index.html', hi:'sko_invaders_best', art:ART.invaders },
    { title:'SKOSNAKE',        genre:'SBÍREJ MINCE',    url:'snake/index.html',    hi:'sko_snake_best',    art:ART.snake },
    { title:'SKOBREAKOUT',     genre:'ROZBIJ CIHLY',    url:'breakout/index.html', hi:'sko_breakout_best', art:ART.breakout },
  ];

  const grid = document.getElementById('grid');
  let sel = 0;

  GAMES.forEach((g,i)=>{
    const hi = localStorage.getItem(g.hi) || 0;
    const card = document.createElement('div');
    card.className = 'card' + (i===0?' sel':'');
    card.innerHTML =
      '<div class="frame">'+g.art+'</div>' +
      '<div class="cap">'+g.title+'</div>' +
      '<div class="genre">'+g.genre+'</div>' +
      '<div class="hi">HI '+String(hi).padStart(5,'0')+'</div>';
    card.addEventListener('click', ()=>{ sel=i; render(); launch(); });
    card.addEventListener('mouseenter', ()=>{ sel=i; render(); });
    grid.appendChild(card);
  });

  const cards = [...document.querySelectorAll('.card')];
  function render(){ cards.forEach((c,i)=>c.classList.toggle('sel', i===sel)); }
  function launch(){ window.location.href = GAMES[sel].url; }

  document.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowRight': case 'd': case 'ArrowDown': case 's':
        sel=(sel+1)%GAMES.length; render(); break;
      case 'ArrowLeft': case 'a': case 'ArrowUp': case 'w':
        sel=(sel-1+GAMES.length)%GAMES.length; render(); break;
      case 'Enter': case ' ':
        e.preventDefault(); launch(); break;
    }
  });

  // === Retro hvězdné pole ===
  const sc=document.getElementById('stars'), sx=sc.getContext('2d');
  let starsArr=[];
  function resizeStars(){
    sc.width=window.innerWidth; sc.height=window.innerHeight;
    starsArr=[];
    const n=Math.round((sc.width*sc.height)/9000);
    for(let i=0;i<n;i++) starsArr.push({x:Math.random()*sc.width,y:Math.random()*sc.height,s:Math.random()<.15?2:1,v:0.2+Math.random()*0.9});
  }
  window.addEventListener('resize', resizeStars); resizeStars();
  (function starLoop(){
    requestAnimationFrame(starLoop);
    sx.fillStyle='#02080c'; sx.fillRect(0,0,sc.width,sc.height);
    for(const st of starsArr){
      st.y+=st.v; if(st.y>sc.height){st.y=0;st.x=Math.random()*sc.width;}
      sx.fillStyle=st.s===2?'#62e29a':'#1f5a3d'; sx.fillRect(st.x|0,st.y|0,st.s,st.s);
    }
  })();

  // gamepad (volitelně)
  window.addEventListener('gamepadconnected', ()=>{
    let prev=0;
    (function poll(){
      const gp=navigator.getGamepads()[0];
      if(gp){
        const x=gp.axes[0]||0, now=Date.now();
        if(now-prev>220){
          if(x>0.5){ sel=(sel+1)%GAMES.length; render(); prev=now; }
          else if(x<-0.5){ sel=(sel-1+GAMES.length)%GAMES.length; render(); prev=now; }
        }
        if(gp.buttons.some(b=>b.pressed)) launch();
      }
      requestAnimationFrame(poll);
    })();
  });
</script>
</body>
</html>
