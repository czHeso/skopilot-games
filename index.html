<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŠkoPilot Games — Arcade</title>
<style>
  @font-face{
    font-family:'PixelArcade';
    src:url('assets/fonts/PressStart2P.ttf') format('truetype');
    font-display:swap;
  }
  :root{
    --g1:#2fc56f; --g2:#62e29a; --g3:#0d4631;
    --mint:#b8f5da; --white:#eef6f4; --gold:#f5c518; --bg:#02080c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#02080c;
    color:var(--white);
    font-family:'PixelArcade','Courier New',monospace;
    overflow:hidden; height:100vh;
    user-select:none; cursor:default;
    image-rendering:pixelated;
  }
  /* hvězdné pole */
  #stars{position:fixed;inset:0;z-index:0;}
  /* obsah */
  #screen{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(10px,3vh,40px) 12px;
    text-align:center;
  }
  /* CRT efekty */
  #screen::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:41;
    box-shadow:inset 0 0 160px 50px rgba(0,0,0,.95);
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.35) 100%);
  }

  .avatar{
    height:clamp(70px,15vh,170px); width:auto;
    image-rendering:auto;
    filter:drop-shadow(0 0 16px rgba(47,197,111,.55));
    animation:bob 2.4s steps(2,end) infinite;
  }
  @keyframes bob{50%{transform:translateY(-7px);}}

  .title{
    margin-top:clamp(8px,2vh,20px);
    font-size:clamp(18px,4.4vw,46px);
    line-height:1.25;
    color:var(--g2);
    text-shadow:3px 3px 0 var(--g3), 0 0 14px rgba(47,197,111,.6);
    letter-spacing:2px;
    animation:hue 6s steps(1) infinite;
  }
  .title b{color:var(--white);}
  @keyframes hue{0%,90%{opacity:1}92%{opacity:.6}94%{opacity:1}96%{opacity:.7}}
  .subtitle{
    margin-top:clamp(8px,1.6vh,16px);
    font-size:clamp(8px,1.5vw,13px);
    color:var(--gold);
    letter-spacing:2px;
  }

  /* MENU LIST */
  .menu{
    margin-top:clamp(16px,4vh,46px);
    display:flex;flex-direction:column;
    gap:clamp(12px,2.4vh,26px);
    width:min(620px,92vw);
  }
  .item{
    display:grid;
    grid-template-columns:1.4em 1fr auto;
    align-items:center;
    gap:.6em;
    font-size:clamp(11px,2vw,20px);
    color:#3f6b55;
    padding:4px 6px;
    cursor:pointer;
    transition:color .08s;
  }
  .item .cur{visibility:hidden;color:var(--g1);}
  .item .name{text-align:left;letter-spacing:1px;}
  .item .hi{font-size:.7em;color:#2c5a40;}
  .item.sel{color:var(--white);}
  .item.sel .cur{visibility:visible;animation:blink .5s steps(1) infinite;}
  .item.sel .name{color:var(--g2);text-shadow:0 0 10px rgba(47,197,111,.7);}
  .item.sel .hi{color:var(--gold);}
  @keyframes blink{50%{opacity:0;}}

  .foot{
    margin-top:auto;
    display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);
    align-items:center;
  }
  .coin{
    font-size:clamp(10px,1.9vw,18px);color:#fff;letter-spacing:2px;
    animation:blink 1.1s steps(1) infinite;
  }
  .hint{font-size:clamp(7px,1.2vw,11px);color:#2c5a40;letter-spacing:1px;line-height:1.8;}
  .credit{font-size:clamp(7px,1.2vw,11px);color:#244;letter-spacing:1px;}
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="screen">
    <img class="avatar" src="assets/skopilot.png"
         onerror="this.onerror=null;this.src='invaders/skopilotHead.png'" alt="ŠkoPilot">
    <div class="title">ŠKO<b>PILOT</b><br>GAMES</div>
    <div class="subtitle">ŠKOPILOT EDITION</div>

    <div class="menu" id="menu"></div>

    <div class="foot">
      <div class="coin">PUSH START</div>
      <div class="hint">JOYSTICK / &uarr;&darr; VYBER &nbsp;&middot;&nbsp; START / ENTER HRAJ &nbsp;&middot;&nbsp; ESC = MENU</div>
      <div class="credit">&copy; 2026 ŠKODA &middot; SKOPILOT ARCADE</div>
    </div>
  </div>

<script>
  const GAMES = [
    { title:'FLAPPY SKOPILOT', url:'flappy/index.html',   hi:'sko_flappy_best'   },
    { title:'SKOINVADERS',     url:'invaders/index.html', hi:'sko_invaders_best' },
    { title:'SKOSNAKE',        url:'snake/index.html',    hi:'sko_snake_best'    },
    { title:'SKOBREAKOUT',     url:'breakout/index.html', hi:'sko_breakout_best' },
  ];

  const menu = document.getElementById('menu');
  let sel = 0;

  GAMES.forEach((g,i)=>{
    const hi = localStorage.getItem(g.hi) || 0;
    const row = document.createElement('div');
    row.className = 'item' + (i===0?' sel':'');
    row.innerHTML =
      '<span class="cur">&#9656;</span>' +
      '<span class="name">'+g.title+'</span>' +
      '<span class="hi">HI '+String(hi).padStart(5,'0')+'</span>';
    row.addEventListener('click', ()=>{ sel=i; render(); launch(); });
    row.addEventListener('mouseenter', ()=>{ sel=i; render(); });
    menu.appendChild(row);
  });

  const rows = [...document.querySelectorAll('.item')];
  function render(){ rows.forEach((r,i)=>r.classList.toggle('sel', i===sel)); }
  function launch(){ window.location.href = GAMES[sel].url; }

  document.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowDown': case 's': case 'ArrowRight': case 'd':
        sel=(sel+1)%GAMES.length; render(); break;
      case 'ArrowUp': case 'w': case 'ArrowLeft': case 'a':
        sel=(sel-1+GAMES.length)%GAMES.length; render(); break;
      case 'Enter': case ' ':
        e.preventDefault(); launch(); break;
    }
  });

  // === Retro hvězdné pole ===
  const sc = document.getElementById('stars');
  const sx = sc.getContext('2d');
  let starsArr=[];
  function resizeStars(){
    sc.width = window.innerWidth; sc.height = window.innerHeight;
    starsArr = [];
    const n = Math.round((sc.width*sc.height)/9000);
    for(let i=0;i<n;i++){
      starsArr.push({
        x:Math.random()*sc.width, y:Math.random()*sc.height,
        s:Math.random()<.15?2:1,
        v:0.2+Math.random()*0.9
      });
    }
  }
  window.addEventListener('resize', resizeStars);
  resizeStars();
  function starLoop(){
    requestAnimationFrame(starLoop);
    sx.fillStyle='#02080c'; sx.fillRect(0,0,sc.width,sc.height);
    for(const st of starsArr){
      st.y += st.v;
      if(st.y>sc.height){ st.y=0; st.x=Math.random()*sc.width; }
      sx.fillStyle = st.s===2 ? '#62e29a' : '#1f5a3d';
      sx.fillRect(st.x|0, st.y|0, st.s, st.s);
    }
  }
  starLoop();

  // gamepad (volitelně)
  window.addEventListener('gamepadconnected', ()=>{
    let prev=0;
    (function poll(){
      const gp=navigator.getGamepads()[0];
      if(gp){
        const y=gp.axes[1]||0, now=Date.now();
        if(now-prev>220){
          if(y>0.5){ sel=(sel+1)%GAMES.length; render(); prev=now; }
          else if(y<-0.5){ sel=(sel-1+GAMES.length)%GAMES.length; render(); prev=now; }
        }
        if(gp.buttons.some(b=>b.pressed)) launch();
      }
      requestAnimationFrame(poll);
    })();
  });
</script>
</body>
</html>
