<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ŠkoSnake</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body{height:100%;}
    body { background:#03100a; display:flex; align-items:center; justify-content:center;
           height:100vh; overflow:hidden; font-family:'Trebuchet MS', system-ui, sans-serif;
           color:#eef6f4; user-select:none; }
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);
    }
    #stage{ transform-origin:center center; position:relative; }
    #hud { display:flex; gap:2.2rem; margin-bottom:.7rem; font-size:20px; color:#5a8a72; letter-spacing:1px; }
    #hud span { font-weight:700; color:#eef6f4; font-size:22px; }
    canvas { border-radius:8px; border:2px solid #1c4a35; display:block; background:#07140d;
             box-shadow:0 0 30px rgba(47,197,111,.25); }
    #hint { margin-top:.6rem; font-size:14px; color:#3f6b55; text-align:center; }
    #menuBtn{
      position:fixed; top:14px; left:14px; z-index:60;
      background:#0c2418; color:#b8f5da; border:1px solid #235c41;
      border-radius:8px; padding:8px 14px; font-size:15px; letter-spacing:1px;
      cursor:pointer; font-family:inherit;
    }
    #menuBtn:hover{ background:#11331f; }
  </style>
</head>
<body>
  <button id="menuBtn" onclick="location.href='../index.html'">◀ MENU</button>
  <div id="stage">
    <div id="hud">SKÓRE: <span id="score">0</span>&nbsp;&nbsp; NEJLEPŠÍ: <span id="best">0</span>&nbsp;&nbsp; 🪙 <span id="coins">0</span></div>
    <canvas id="c" width="600" height="600"></canvas>
    <div id="hint">Šipky / WASD = směr &nbsp;|&nbsp; Mezerník = start &nbsp;|&nbsp; ESC = menu</div>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const coinsEl = document.getElementById('coins');
const stage   = document.getElementById('stage');

// === Škálování na celou obrazovku ===
function fitStage(){
  const s = Math.min(window.innerWidth / stage.offsetWidth,
                     window.innerHeight / stage.offsetHeight);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
fitStage();

// === Hlava maskota ===
const headImg = new Image();
headImg.src = '../invaders/skopilotHead.png';

const CELL = 40;
const COLS = canvas.width / CELL;   // 15
const ROWS = canvas.height / CELL;  // 15

let snake, dir, nextDir, food, score, coins, best, state, tickMs, acc, lastTs, growBy;

best = +localStorage.getItem('sko_snake_best') || 0;
bestEl.textContent = best;

function placeFood(){
  let p;
  do { p = { x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0 }; }
  while (snake.some(s => s.x===p.x && s.y===p.y));
  food = p;
}

function init(){
  snake = [ {x:9,y:10}, {x:8,y:10}, {x:7,y:10} ];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0; coins = 0; growBy = 0;
  tickMs = 150;
  acc = 0; lastTs = 0;
  scoreEl.textContent = 0;
  coinsEl.textContent = 0;
  placeFood();
  state = 'idle';
}

function setDir(x,y){
  // zákaz otočky o 180°
  if (dir.x === -x && dir.y === -y) return;
  nextDir = {x,y};
}

document.addEventListener('keydown', e=>{
  switch(e.key){
    case 'ArrowUp': case 'w': e.preventDefault(); setDir(0,-1); start(); break;
    case 'ArrowDown': case 's': e.preventDefault(); setDir(0,1); start(); break;
    case 'ArrowLeft': case 'a': e.preventDefault(); setDir(-1,0); start(); break;
    case 'ArrowRight': case 'd': e.preventDefault(); setDir(1,0); start(); break;
    case ' ': case 'Enter':
      e.preventDefault();
      if (state==='idle') state='playing';
      else if (state==='dead') { init(); state='playing'; }
      break;
    case 'Escape': location.href='../index.html'; break;
  }
});

function start(){
  if (state==='idle') state='playing';
  else if (state==='dead') { init(); state='playing'; }
}

function tick(){
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // náraz do zdi
  if (head.x<0 || head.y<0 || head.x>=COLS || head.y>=ROWS){ die(); return; }
  // náraz do sebe
  if (snake.some(s => s.x===head.x && s.y===head.y)){ die(); return; }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y){
    score += 10; coins += 1;
    scoreEl.textContent = score;
    coinsEl.textContent = coins;
    if (score > best){ best = score; bestEl.textContent = best; localStorage.setItem('sko_snake_best', best); }
    growBy += 1;
    // zrychlení
    if (tickMs > 70) tickMs -= 4;
    placeFood();
  }

  if (growBy > 0) growBy--;
  else snake.pop();
}

function die(){ state='dead'; }

// === VYKRESLENÍ ===
function drawGrid(){
  ctx.strokeStyle = 'rgba(47,197,111,0.06)';
  ctx.lineWidth = 1;
  for (let i=1;i<COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
  }
}

function roundCell(x,y,pad,col){
  const r=8;
  const px=x*CELL+pad, py=y*CELL+pad, s=CELL-pad*2;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(px+r,py);
  ctx.arcTo(px+s,py,px+s,py+s,r);
  ctx.arcTo(px+s,py+s,px,py+s,r);
  ctx.arcTo(px,py+s,px,py,r);
  ctx.arcTo(px,py,px+s,py,r);
  ctx.closePath(); ctx.fill();
}

function drawCoin(){
  const cx=food.x*CELL+CELL/2, cy=food.y*CELL+CELL/2, r=10;
  ctx.save();
  ctx.shadowColor='#ffe066'; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#f5c518'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx-3,cy-3,r*0.45,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,200,.6)'; ctx.fill();
  ctx.fillStyle='#c8960a'; ctx.font='bold 12px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('$',cx,cy);
  ctx.restore();
}

function drawSnake(){
  // tělo (od ocasu k hlavě), gradient zelené
  for (let i=snake.length-1; i>=1; i--){
    const t = i/snake.length;
    const col = i%2===0 ? '#2fc56f' : '#27b063';
    roundCell(snake[i].x, snake[i].y, 3, col);
  }
  // hlava maskota
  const h = snake[0];
  const px=h.x*CELL, py=h.y*CELL;
  if (headImg.complete && headImg.naturalWidth!==0){
    ctx.save();
    ctx.translate(px+CELL/2, py+CELL/2);
    // pootočení podle směru
    let ang = 0;
    if (dir.x===1) ang=0; else if (dir.x===-1) ang=Math.PI;
    else if (dir.y===1) ang=Math.PI/2; else if (dir.y===-1) ang=-Math.PI/2;
    // hlava maskota je „čelem", necháme ji vzpřímenou, jen lehce naznačíme směr posunem
    ctx.drawImage(headImg, -CELL/2+1, -CELL/2+1, CELL-2, CELL-2);
    ctx.restore();
  } else {
    roundCell(h.x,h.y,2,'#62e29a');
  }
}

function drawOverlay(){
  ctx.fillStyle='rgba(3,16,10,0.82)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';
  const cx=canvas.width/2, cy=canvas.height/2;
  if (state==='idle'){
    ctx.fillStyle='#2fc56f'; ctx.font='900 44px Trebuchet MS, sans-serif';
    ctx.fillText('ŠkoSnake',cx,cy-30);
    ctx.fillStyle='#cdeede'; ctx.font='17px sans-serif';
    ctx.fillText('Sbírej Škoda mince a rosti!',cx,cy+8);
    ctx.fillStyle='#ffff44'; ctx.font='bold 16px sans-serif';
    ctx.fillText('Šipka nebo Mezerník = start',cx,cy+44);
  } else if (state==='dead'){
    ctx.fillStyle='#ff6a6a'; ctx.font='900 42px Trebuchet MS, sans-serif';
    ctx.fillText('KONEC HRY',cx,cy-30);
    ctx.fillStyle='#cdeede'; ctx.font='18px sans-serif';
    ctx.fillText('Skóre: '+score+'   Nejlepší: '+best,cx,cy+8);
    ctx.fillStyle='#ffff44'; ctx.font='bold 16px sans-serif';
    ctx.fillText('Mezerník pro restart',cx,cy+44);
  }
}

function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const delta = ts - lastTs; lastTs = ts;

  if (state==='playing'){
    acc += delta;
    while (acc >= tickMs){ acc -= tickMs; tick(); }
  }

  ctx.fillStyle='#07140d'; ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();
  drawCoin();
  drawSnake();
  if (state!=='playing') drawOverlay();
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
