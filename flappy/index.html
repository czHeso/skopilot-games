<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy ŠkoPilot</title>
  <style>
    @font-face{ font-family:'PixelArcade'; src:url('../assets/fonts/PressStart2P.ttf') format('truetype'); font-display:swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    *{cursor:none !important;}   /* kiosk: hide mouse cursor (Wayland-safe) */
    /* hall of fame: allow the mouse so records can be deleted by clicking */
    body.allow-cursor, body.allow-cursor *{cursor:auto !important;}
    html,body{height:100%;}
    body {
      background:#040b09;
      display: flex; align-items: center; justify-content: center;
      height:100vh; overflow:hidden;
      font-family: 'PixelArcade','Courier New', monospace;
      user-select:none; image-rendering:pixelated;
    }
    /* circuit backdrop */
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse at 50% 40%, rgba(8,30,24,.4), rgba(4,11,9,.94) 80%),
                 url('../assets/8bit/circuit.jpg') center/cover no-repeat; opacity:.45;}
    /* CRT scanlines */
    body::after{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
      background:repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px);
    }
    #stage{ transform-origin:center center; position:relative; z-index:3; }
    #hud { display:flex; gap:1.6rem; margin-bottom:.7rem; font-size:12px; color:#1f9c5e; letter-spacing:1px; }
    #hud span { color:#c9ffe2; }
    #canvas { border:3px solid #155047; display:block; cursor:pointer; image-rendering:pixelated;
              box-shadow:0 0 0 3px #040b09, 0 0 0 5px #0c3329, 0 0 34px rgba(57,255,140,.28); }
    #hint { margin-top:.7rem; font-size:8px; color:#1f9c5e; text-align:center; letter-spacing:1px; line-height:1.6; }
    #menuBtn{
      position:fixed; top:14px; left:14px; z-index:60;
      background:#0c2418; color:#c9ffe2; border:2px solid #1f9c5e;
      padding:9px 14px; font-size:10px; letter-spacing:1px;
      cursor:pointer; font-family:inherit;
      box-shadow:0 0 0 2px #040b09, 0 0 14px rgba(57,255,140,.25);
    }
    #menuBtn:hover{ background:#11331f; color:#39ff8c; }
    #controlsHelp{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      width:auto; height:auto;
      max-width:min(82vw,1200px); max-height:32vh;
      z-index:40; pointer-events:none; display:none;
      image-rendering:auto;
      filter:drop-shadow(0 8px 30px rgba(57,255,140,.5)) brightness(.95);
    }
    #controlsHelp.show{ display:block; animation:helpFade .4s ease-out both; }
    @keyframes helpFade{
      from{ opacity:0; transform:translate(-50%, 14px); }
      to{ opacity:1; transform:translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <button id="menuBtn" onclick="location.href='../index.html'">&#9664; MENU</button>
  <img id="controlsHelp" src="../assets/controls-1.png" alt="ovládání"
       onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='../assets/controls.png';}else{this.style.display='none';this.dataset.missing='1';}">
  <div id="stage">
    <div id="hud">SCORE <span id="score">0</span> &nbsp; BEST <span id="best">0</span> &nbsp; <span style="color:#ffcf2e">$</span> <span id="coins">0</span></div>
    <canvas id="canvas" width="580" height="380"></canvas>
    <div id="hint">SPACE / CLICK = FLAP &nbsp;&middot;&nbsp; ESC = MENU</div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const coinsEl = document.getElementById('coins');
    const stage = document.getElementById('stage');

    // === Scale to full screen (arcade) ===
    function fitStage(){
      const s = Math.min(window.innerWidth / stage.offsetWidth,
                         window.innerHeight / stage.offsetHeight);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('load', fitStage);
    fitStage();

    const W = canvas.width, H = canvas.height;
    const GRAVITY = 0.28;
    const JUMP = -5.2;
    const PIPE_W = 52;
    const PIPE_SPEED = 2.4;
    const PIPE_INTERVAL = 1600;
    const BALL_X = 110;
    const GROUND = 40;

    const HIT_RX = 22;
    const HIT_RY = 19;
    const HIT_OY = 0;

    // Generuje zamíchanou sadu podle aktuálního skóre
    let gapQueue = [];
    function buildGapQueue() {
      const big   = () => Math.floor(Math.random() * 20) + 180;  // 180-200
      const mid   = () => Math.floor(Math.random() * 20) + 125;  // 125-145
      const small = () => Math.floor(Math.random() * 15) + 100;   // 100-115

      let arr;
      if (score >= 30) {
        // Od 30: 0 velká, 2 střední, 3 malé
        arr = [mid(), mid(), small(), small(), small()];
      } else if (score >= 20) {
        // Od 20: 0 velká, 4 střední, 1 malé
        arr = [big(), mid(), mid(), small(), small()];
      } else if (score >= 10) {
        // Od 10: 2 velká, 3 střední, 0 malé
        arr = [big(), big(), mid(), mid(), mid()];
      } else {
        // Začátek: 3 velká, 2 střední, 0 malá
        arr = [big(), big(), big(), mid(), mid()];
      }

      // zamíchej Fisher-Yates
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      gapQueue = arr;
    }
    function nextGapValue() {
      if (gapQueue.length === 0) buildGapQueue();
      return gapQueue.shift();
    }

    // ŠkoPilot 8bit head (transparent PNG)
    const sprite = new Image();
    let spriteReady = false;
    sprite.onload = () => { spriteReady = true; };
    sprite.onerror = () => { sprite.onerror = null; sprite.src = '../assets/skopilotHead.png'; };
    sprite.src = '../assets/8bit/skopilot-head.png';

    let ball, pipes, coins, pipeCount, score, best, state, lastPipe, tick = 0;
    // fixed-timestep simulation (frame-rate independent — no slow/fast on FPS dips)
    const STEP = 1000 / 60;
    let acc = 0, lastTs = 0, simTime = 0;
    best = +localStorage.getItem('sko_flappy_best') || 0;
    bestEl.textContent = best;

    // === Hall of Fame ===
    function loadScores(){ try { return JSON.parse(localStorage.getItem('sko_flappy_scores')) || []; } catch(e){ return []; } }
    function saveScores(s){ localStorage.setItem('sko_flappy_scores', JSON.stringify(s)); }
    let scores = loadScores();
    // seed defaults only on the very first run — an emptied (deleted) table stays empty
    if (localStorage.getItem('sko_flappy_scores') === null){ scores = [{n:'SKO',s:25},{n:'PIL',s:18},{n:'OT0',s:12},{n:'AAA',s:6},{n:'BUG',s:2}]; saveScores(scores); }

    // name entry: up to 5 chars — A-Z, 1-9, '-', '/' and blank (space); trailing blanks are trimmed
    const NAME_LEN = 5;
    const NAME_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789-/ ';
    let entryName = ['A',' ',' ',' ',' '], entryPos = 0;
    // confirm step before saving the name (accidental B-press protection)
    let entryConfirm = false, entryYes = false;
    function resetEntry(){ entryName = ['A',' ',' ',' ',' ']; entryPos = 0; entryConfirm = false; entryYes = false; }
    function askSaveConfirm(){ entryConfirm = true; entryYes = false; }
    function cycleChar(dir){
      let i = NAME_CHARS.indexOf(entryName[entryPos]); if (i < 0) i = 0;
      entryName[entryPos] = NAME_CHARS[(i + dir + NAME_CHARS.length) % NAME_CHARS.length];
    }

    // hall-of-fame management: MANAGE RECORDS submenu (delete one / delete all)
    let scoreSel = -1, delConfirm = false, delYes = false, manage = false;
    // rows: main view = records + MANAGE; manage view = records + DELETE ALL + BACK
    function scRows(){ return manage ? scores.length + 2 : scores.length + 1; }
    function openScores(){ scoreSel = -1; delConfirm = false; manage = false; state = 'scores'; }
    function enterManage(){ manage = true; delConfirm = false; scoreSel = scores.length ? 0 : 1; }
    function activateManage(){
      if (scoreSel === scores.length + 1){ manage = false; scoreSel = -1; }   // BACK
      else if (scoreSel >= 0){ delConfirm = true; delYes = false; }           // record / DELETE ALL
    }
    function doDelete(){
      if (scoreSel === scores.length){            // DELETE ALL
        scores = []; saveScores(scores);
        best = 0; bestEl.textContent = 0; localStorage.removeItem('sko_flappy_best');
        scoreSel = 1;                             // land on BACK
      } else if (scoreSel >= 0 && scoreSel < scores.length){
        scores.splice(scoreSel, 1); saveScores(scores);
      }
      if (scoreSel > scores.length + 1) scoreSel = scores.length + 1;
    }

    function init() {
      ball = { y: H / 2, vy: 0 };
      pipes = [];
      score = 0; coins = 0; pipeCount = 0;
      state = 'idle'; lastPipe = 0; simTime = 0; acc = 0;
      gapQueue = [];
      scoreEl.textContent = 0; coinsEl.textContent = 0;
    }

    function spawnPipe() {
      const gap = nextGapValue();
      const minH = 50, maxH = H - GROUND - 50 - gap;
      const topH = Math.floor(Math.random() * (maxH - minH) + minH);
      pipeCount++;
      const hasCoin = (pipeCount % 5 === 0);
      const coinY = topH + gap / 2;
      pipes.push({ x: W + 10, topH, gap, scored: false, hasCoin, coinY, coinX: W + 10 + PIPE_W / 2, coinCollected: false });
    }

    function primary() {
      if (state === 'idle') { state = 'playing'; ball.vy = JUMP; }
      else if (state === 'playing') { ball.vy = JUMP; }
      else if (state === 'dead') { afterDeath(); }
      else if (state === 'enter') {
        if (entryConfirm) { if (entryYes) confirmName(); else entryConfirm = false; }
        else askSaveConfirm();
      }
      else if (state === 'scores') { init(); }
    }
    function afterDeath() {
      const min = scores.length < 5 ? -1 : scores[scores.length - 1].s;
      if (score > min) { resetEntry(); state = 'enter'; }
      else init();
    }
    function confirmName() {
      scores.push({ n: entryName.join('').trim() || 'AAA', s: score });
      scores.sort((a,b)=>b.s-a.s); scores = scores.slice(0,5); saveScores(scores);
      openScores();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { location.href = '../index.html'; return; }
      if (state === 'enter') {
        if (entryConfirm) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); entryYes = !entryYes; }
          else if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (entryYes) confirmName(); else entryConfirm = false; }
          else if (e.key === 'Backspace') { e.preventDefault(); entryConfirm = false; }
          return;
        }
        // direct typing (keyboard): letters, digits 1-9, '-' and '/'
        if (/^[a-zA-Z0-9\/-]$/.test(e.key)) {
          e.preventDefault();
          const ch = e.key.toUpperCase();
          if (NAME_CHARS.includes(ch)) { entryName[entryPos] = ch; if (entryPos < NAME_LEN-1) entryPos++; }
          return;
        }
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (entryName[entryPos] === ' ' && entryPos > 0) entryPos--;
          entryName[entryPos] = ' ';
          return;
        }
        // arcade-style joystick entry
        if (e.key === 'ArrowUp') { e.preventDefault(); cycleChar(1); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); cycleChar(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); entryPos = (entryPos+1)%NAME_LEN; }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); entryPos = (entryPos+NAME_LEN-1)%NAME_LEN; }
        else if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); askSaveConfirm(); }
        return;
      }
      if (state === 'scores') {
        if (delConfirm) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); delYes = !delYes; }
          else if (e.code === 'Space' || e.key === 'Enter' || e.key === 'x' || e.key === 'X') {
            e.preventDefault(); if (delYes) doDelete(); delConfirm = false;
          }
          return;
        }
        if (manage) {
          const items = scores.length + 2;
          if (e.key === 'ArrowDown') { e.preventDefault(); scoreSel = (scoreSel + 1) % items; return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); scoreSel = (scoreSel <= 0 ? items : scoreSel) - 1; return; }
          if (e.code === 'Space' || e.key === 'Enter' || e.key === 'x' || e.key === 'X' || e.key === 'Delete') {
            e.preventDefault(); activateManage();
          }
          return;
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault(); scoreSel = scoreSel === scores.length ? -1 : scores.length; return;
        }
        if (e.key === 'x' || e.key === 'X' || e.key === 'Delete') { e.preventDefault(); enterManage(); return; }
        if (e.code === 'Space' || e.key === 'Enter') {
          e.preventDefault();
          if (scoreSel === scores.length) enterManage(); else init();
        }
        return;
      }
      if (state === 'idle' && (e.key === 'ArrowUp' || e.key === 'Backspace')) { e.preventDefault(); openScores(); return; }
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); primary(); }
    });

    // ===== mouse on the hall of fame (hover + click to delete) =====
    const SC = { rowY0: 92, rowH: 36, rowW: 400, cfW: 420, cfH: 130, btnW: 110, btnH: 34 };
    function canvasPos(e){
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    }
    function scoresRowAt(x, y){
      if (Math.abs(x - W/2) > SC.rowW/2) return -1;
      for (let i = 0; i < scRows(); i++){
        const cy = SC.rowY0 + i*SC.rowH;
        if (y > cy - SC.rowH/2 && y < cy + SC.rowH/2){
          if (!manage && i !== scores.length) return -1;   // main view: only MANAGE row is clickable
          return i;
        }
      }
      return -1;
    }
    function confirmHit(x, y){
      const by = H/2 + 24;
      if (Math.abs(y - by) > SC.btnH/2) return null;
      if (Math.abs(x - (W/2 - 75)) < SC.btnW/2) return 'no';
      if (Math.abs(x - (W/2 + 75)) < SC.btnW/2) return 'yes';
      return null;
    }
    canvas.addEventListener('mousemove', e => {
      if (state !== 'scores' || delConfirm) return;
      const p = canvasPos(e);
      const row = scoresRowAt(p.x, p.y);
      if (manage) { if (row >= 0) scoreSel = row; }
      else scoreSel = row;
    });
    canvas.addEventListener('click', e => {
      if (state !== 'scores') { primary(); return; }
      const p = canvasPos(e);
      if (delConfirm) {
        const hit = confirmHit(p.x, p.y);
        if (hit) { if (hit === 'yes') doDelete(); delConfirm = false; }
        return;
      }
      const row = scoresRowAt(p.x, p.y);
      if (!manage) {
        if (row === scores.length) enterManage();
        else init();
        return;
      }
      if (row >= 0) { scoreSel = row; activateManage(); }
    });

    // === background: dark + scrolling binary columns + ground ===
    function drawSky() {
      ctx.fillStyle = '#04100b';
      ctx.fillRect(0, 0, W, H - GROUND);
      // faint binary rain (kept light for low-end hardware)
      ctx.font = '12px PixelArcade, monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      for (let cx = 6; cx < W; cx += 34) {
        const colShift = (tick * (0.6 + (cx % 3) * 0.25)) % (H - GROUND + 60);
        for (let k = 0; k < 5; k++) {
          const yy = ((colShift + k * 34) % (H - GROUND + 60)) - 14;
          if (yy < -12 || yy > H - GROUND) continue;
          ctx.globalAlpha = 0.06 + (k === 0 ? 0.05 : 0);
          ctx.fillStyle = k === 0 ? '#39ff8c' : '#1f9c5e';
          ctx.fillText(((cx + (yy|0)) % 5) ? '0' : '1', cx, yy);
        }
      }
      ctx.globalAlpha = 1;
      // ground
      ctx.fillStyle = '#0d2c1d';
      ctx.fillRect(0, H - GROUND, W, GROUND);
      ctx.fillStyle = '#155047';
      ctx.fillRect(0, H - GROUND, W, 3);
      ctx.fillStyle = '#0a2417';
      for (let x = (tick * PIPE_SPEED) % 24; x < W; x += 24) ctx.fillRect(W - x, H - GROUND + 6, 12, GROUND - 6);
    }

    function drawPipe(p) {
      const bot = p.topH + p.gap;
      // body
      ctx.fillStyle = '#1f9c5e';
      ctx.fillRect(p.x, 0, PIPE_W, p.topH);
      ctx.fillRect(p.x, bot, PIPE_W, H - bot - GROUND);
      // pixel highlight + shade
      ctx.fillStyle = '#39ff8c';
      ctx.fillRect(p.x + 4, 0, 6, p.topH);
      ctx.fillRect(p.x + 4, bot, 6, H - bot - GROUND);
      ctx.fillStyle = '#0d4631';
      ctx.fillRect(p.x + PIPE_W - 8, 0, 8, p.topH);
      ctx.fillRect(p.x + PIPE_W - 8, bot, 8, H - bot - GROUND);
      // caps
      ctx.fillStyle = '#0d4631';
      ctx.fillRect(p.x - 5, p.topH - 18, PIPE_W + 10, 18);
      ctx.fillRect(p.x - 5, bot, PIPE_W + 10, 18);
      ctx.fillStyle = '#39ff8c';
      ctx.fillRect(p.x - 5, p.topH - 18, PIPE_W + 10, 3);
      ctx.fillRect(p.x - 5, bot + 15, PIPE_W + 10, 3);
    }

    function drawCoin(p) {
      if (!p.hasCoin || p.coinCollected) return;
      const cx = p.coinX, cy = p.coinY, s = 9;
      ctx.save();
      ctx.shadowColor = '#ffcf2e'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffcf2e';
      ctx.fillRect(cx - s, cy - s, s * 2, s * 2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff4b0'; ctx.fillRect(cx - s + 2, cy - s + 2, 4, 4);
      ctx.fillStyle = '#7a5c00';
      ctx.font = 'bold 11px PixelArcade, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, cy + 1);
      ctx.restore();
    }

    function drawAvatar() {
      const tilt = Math.max(-0.4, Math.min(0.5, ball.vy * 0.05));
      ctx.save();
      ctx.translate(BALL_X, ball.y + HIT_OY);
      ctx.rotate(tilt);
      if (spriteReady) {
        const sw = 52, sh = sw * sprite.height / sprite.width;
        ctx.drawImage(sprite, -sw/2, -sh/2, sw, sh);
      } else {
        ctx.fillStyle = '#39ff8c';
        ctx.fillRect(-HIT_RX, -HIT_RY, HIT_RX*2, HIT_RY*2);
      }
      ctx.restore();
    }

    function collidesEllipse(p) {
      const cx = BALL_X, cy = ball.y + HIT_OY;
      const rx = HIT_RX, ry = HIT_RY;
      function hits(bx, by, bw, bh) {
        const nx = Math.max(bx, Math.min(cx, bx+bw));
        const ny = Math.max(by, Math.min(cy, by+bh));
        const dx = (cx-nx)/rx, dy = (cy-ny)/ry;
        return dx*dx + dy*dy < 1;
      }
      if (hits(p.x-5, 0, PIPE_W+10, p.topH)) return true;
      if (hits(p.x-5, p.topH-18, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap, PIPE_W+10, 18)) return true;
      if (hits(p.x-5, p.topH+p.gap+18, PIPE_W+10, H)) return true;
      return false;
    }

    function panel(a){ ctx.fillStyle = 'rgba(4,11,9,'+a+')'; ctx.fillRect(0,0,W,H); }

    function drawOverlay() {
      panel(0.84);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      if (state === 'idle') {
        ctx.fillStyle = '#39ff8c'; ctx.font = '20px PixelArcade, monospace';
        ctx.fillText('FLAPPY', W/2, H/2 - 36);
        ctx.fillText('ŠKOPILOT', W/2, H/2 - 8);
        if (Math.floor(tick/20)%2 === 0) {
          ctx.fillStyle = '#c9ffe2'; ctx.font = '9px PixelArcade, monospace';
          ctx.fillText('CLICK / SPACE TO START', W/2, H/2 + 30);
        }
        ctx.fillStyle = '#1f9c5e'; ctx.font = '7px PixelArcade, monospace';
        ctx.fillText('▲ UP / BKSP = HALL OF FAME', W/2, H/2 + 58);
      } else {
        ctx.fillStyle = '#ff5d5d'; ctx.font = '20px PixelArcade, monospace';
        ctx.fillText('GAME OVER', W/2, H/2 - 34);
        ctx.fillStyle = '#c9ffe2'; ctx.font = '10px PixelArcade, monospace';
        ctx.fillText('SCORE ' + score + '   BEST ' + best, W/2, H/2 + 2);
        if (Math.floor(tick/20)%2 === 0) {
          ctx.fillStyle = '#39ff8c'; ctx.font = '9px PixelArcade, monospace';
          ctx.fillText('SPACE / CLICK = CONTINUE', W/2, H/2 + 34);
        }
      }
    }

    function drawEnter() {
      panel(0.92);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffcf2e'; ctx.font = '15px PixelArcade, monospace';
      ctx.fillText('NEW HIGH SCORE!', W/2, 70);
      ctx.fillStyle = '#c9ffe2'; ctx.font = '10px PixelArcade, monospace';
      ctx.fillText('SCORE ' + score, W/2, 100);
      ctx.fillStyle = '#39ff8c'; ctx.font = '9px PixelArcade, monospace';
      ctx.fillText('ENTER YOUR NAME', W/2, 140);
      ctx.textBaseline = 'middle';
      for (let i = 0; i < NAME_LEN; i++) {
        const x = W/2 - ((NAME_LEN-1)*56)/2 + i*56;
        ctx.fillStyle = i === entryPos ? '#1f9c5e' : '#0d3a33';
        ctx.fillRect(x-22, 170, 44, 52);
        ctx.fillStyle = i === entryPos ? '#39ff8c' : '#155047';
        ctx.fillRect(x-22, 170, 44, 3);
        if (entryName[i] !== ' ') {
          ctx.fillStyle = '#fff'; ctx.font = '24px PixelArcade, monospace';
          ctx.fillText(entryName[i], x, 198);
        }
        if (i === entryPos && Math.floor(tick/20)%2 === 0) {
          ctx.fillStyle = '#ffcf2e'; ctx.font = '10px PixelArcade, monospace';
          ctx.fillText('▲', x, 156); ctx.fillText('▼', x, 240);
        }
      }
      ctx.fillStyle = '#7e9a90'; ctx.font = '7px PixelArcade, monospace'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('JOY: UP/DOWN CHAR · L/R MOVE · SPACE OK', W/2, 290);
      ctx.fillText('OR TYPE A-Z 1-9 - / · BACKSPACE = ERASE', W/2, 312);
      if (entryConfirm) drawSaveConfirm();
    }

    function drawSaveConfirm(){
      ctx.fillStyle = 'rgba(4,11,9,.92)';
      ctx.fillRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
      ctx.strokeStyle = '#ffcf2e'; ctx.lineWidth = 3;
      ctx.strokeRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff'; ctx.font = '10px PixelArcade, monospace';
      ctx.fillText('SAVE "' + (entryName.join('').trim() || 'AAA') + '" ?', W/2, H/2 - 42);
      ctx.fillStyle = '#ffcf2e';
      ctx.fillText('ARE YOU SURE?', W/2, H/2 - 18);
      [['NO', -75, !entryYes], ['YES', 75, entryYes]].forEach(([t, dx, on]) => {
        const bx = W/2 + dx, by = H/2 + 28;
        ctx.fillStyle = on ? '#1f9c5e' : '#0d3a33';
        ctx.fillRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH);
        if (on){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH); }
        ctx.fillStyle = on ? '#fff' : '#7e9a90'; ctx.font = '11px PixelArcade, monospace';
        ctx.fillText(t, bx, by);
      });
      ctx.textBaseline = 'alphabetic';
    }

    function actionRow(idx, label, danger){
      const cy = SC.rowY0 + idx*SC.rowH, sel = idx === scoreSel;
      if (sel) {
        ctx.fillStyle = danger ? '#3a0f12' : '#0d3a33';
        ctx.fillRect(W/2-SC.rowW/2, cy-SC.rowH/2+3, SC.rowW, SC.rowH-6);
      }
      ctx.fillStyle = sel ? (danger ? '#ff5d5d' : '#39ff8c') : (danger ? '#7e4a4a' : '#7e9a90');
      ctx.font = '9px PixelArcade, monospace';
      ctx.fillText(label, W/2, cy);
    }

    function drawScores() {
      panel(0.93);
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = manage ? '#ffcf2e' : '#39ff8c'; ctx.font = '16px PixelArcade, monospace';
      ctx.fillText(manage ? 'MANAGE RECORDS' : 'HALL OF FAME', W/2, 48);
      ctx.textBaseline = 'middle';
      scores.forEach((e, i) => {
        const cy = SC.rowY0 + i*SC.rowH;
        if (manage && i === scoreSel) {
          ctx.fillStyle = '#0d3a33'; ctx.fillRect(W/2-SC.rowW/2, cy-SC.rowH/2+3, SC.rowW, SC.rowH-6);
          ctx.fillStyle = '#ff5d5d'; ctx.font = '11px PixelArcade, monospace';
          ctx.textAlign = 'right'; ctx.fillText('✖', W/2+SC.rowW/2-12, cy);
          ctx.textAlign = 'center';
        }
        ctx.fillStyle = i === 0 ? '#ffcf2e' : '#c9ffe2';
        ctx.font = '12px PixelArcade, monospace';
        ctx.fillText((i+1) + '. ' + e.n.padEnd(NAME_LEN) + ' ' + String(e.s).padStart(5,'0'), W/2, cy);
      });
      if (manage) {
        actionRow(scores.length, 'DELETE ALL', true);
        actionRow(scores.length + 1, 'BACK', false);
      } else {
        actionRow(scores.length, 'MANAGE RECORDS', false);
      }
      if (!scores.length) {
        ctx.fillStyle = '#3c5a52'; ctx.font = '9px PixelArcade, monospace';
        ctx.fillText('NO RECORDS', W/2, SC.rowY0 + (manage ? 3 : 2)*SC.rowH);
      }
      ctx.textBaseline = 'alphabetic';
      if (manage) {
        ctx.fillStyle = '#3c5a52'; ctx.font = '7px PixelArcade, monospace';
        ctx.fillText('↑↓ / MOUSE = SELECT · X / ENTER = OK', W/2, H - 22);
      } else {
        ctx.fillStyle = '#3c5a52'; ctx.font = '7px PixelArcade, monospace';
        ctx.fillText('X / CLICK = MANAGE RECORDS', W/2, H - 44);
        if (Math.floor(tick/20)%2 === 0) {
          ctx.fillStyle = '#39ff8c'; ctx.font = '9px PixelArcade, monospace';
          ctx.fillText('SPACE = PLAY AGAIN', W/2, H - 18);
        }
      }
      if (delConfirm) drawDelConfirm();
    }

    function drawDelConfirm(){
      ctx.fillStyle = 'rgba(4,11,9,.9)';
      ctx.fillRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
      ctx.strokeStyle = '#ff5d5d'; ctx.lineWidth = 3;
      ctx.strokeRect(W/2-SC.cfW/2, H/2-SC.cfH/2, SC.cfW, SC.cfH);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff'; ctx.font = '10px PixelArcade, monospace';
      const label = scoreSel === scores.length
        ? 'DELETE ALL RECORDS?'
        : 'DELETE ' + (scores[scoreSel] ? scores[scoreSel].n.trim() : '') + ' ?';
      ctx.fillText(label, W/2, H/2 - 30);
      [['NO', -75, !delYes], ['YES', 75, delYes]].forEach(([t, dx, on]) => {
        const bx = W/2 + dx, by = H/2 + 24;
        ctx.fillStyle = on ? (t === 'YES' ? '#7a1f1f' : '#1f9c5e') : '#0d3a33';
        ctx.fillRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH);
        if (on){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(bx-SC.btnW/2, by-SC.btnH/2, SC.btnW, SC.btnH); }
        ctx.fillStyle = on ? '#fff' : '#7e9a90'; ctx.font = '11px PixelArcade, monospace';
        ctx.fillText(t, bx, by);
      });
      ctx.textBaseline = 'alphabetic';
    }

    // one fixed 60Hz step of PLAY physics (frame-rate independent)
    function step() {
      ball.vy += GRAVITY;
      ball.y += ball.vy;
      simTime += STEP;
      if (simTime - lastPipe > PIPE_INTERVAL) { spawnPipe(); lastPipe = simTime; }
      for (let p of pipes) {
        p.x -= PIPE_SPEED;
        p.coinX -= PIPE_SPEED;
        if (!p.scored && p.x + PIPE_W < BALL_X) {
          p.scored = true; score++;
          scoreEl.textContent = score;
          if (score > best) {
            best = score; bestEl.textContent = best;
            localStorage.setItem('sko_flappy_best', best);
          }
        }
        if (p.hasCoin && !p.coinCollected) {
          const dx = BALL_X - p.coinX, dy = (ball.y + HIT_OY) - p.coinY;
          if (Math.sqrt(dx*dx + dy*dy) < HIT_RX + 10) {
            p.coinCollected = true; coins++; coinsEl.textContent = coins;
          }
        }
        if (collidesEllipse(p)) state = 'dead';
      }
      pipes = pipes.filter(p => p.x + PIPE_W > -10);
      if (ball.y + HIT_RY + HIT_OY > H - GROUND || ball.y - HIT_RY + HIT_OY < 0) state = 'dead';
    }

    function loop(ts) {
      requestAnimationFrame(loop);
      tick++;
      if (!lastTs) lastTs = ts;
      // clamp so a long stall (tab hidden) can't fast-forward the whole game
      acc += Math.min(ts - lastTs, 200);
      lastTs = ts;
      if (state === 'playing') {
        while (state === 'playing' && acc >= STEP) { acc -= STEP; step(); }
      } else {
        acc = 0;
      }
      drawSky();
      for (let p of pipes) drawPipe(p);
      for (let p of pipes) drawCoin(p);
      drawAvatar();
      if (state === 'idle' || state === 'dead') drawOverlay();
      else if (state === 'enter') drawEnter();
      else if (state === 'scores') drawScores();
      const help = document.getElementById('controlsHelp');
      if (help && !help.dataset.missing) help.classList.toggle('show', state === 'idle');
      document.body.classList.toggle('allow-cursor', state === 'scores');
    }

    init();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
